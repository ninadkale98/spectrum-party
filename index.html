<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F23">
<title>Spectrum Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout concept: one dark "game show" stage. A big spectrum bar is the hero on every screen;
   pins (guesses) and one hot marker (the secret number) land on it. Phones get a single column,
   the big screen scales up with vw units. */
:root{
  --bg:#0B0F23; --panel:#141A3A; --panel2:#1B2350; --line:#2B3570;
  --text:#EEF1FF; --muted:#9AA5DC;
  --hot:#FF4F6D; --sun:#FFD23F; --mint:#3DDC97; --cyan:#46C8FF; --ink:#0B0F23;
  --display:'Unbounded',system-ui,sans-serif; --body:'Figtree',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(16px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));
  background:radial-gradient(1200px 600px at 80% -10%,#1d2766 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#3a1240 0%,transparent 55%),var(--bg);overflow-x:hidden}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.center{display:grid;place-items:center;min-height:60vh;color:var(--muted);text-align:center}
.brand{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.code{font-size:13px;color:var(--muted)} .code b{font-family:var(--display);color:var(--sun);letter-spacing:.12em;margin-left:4px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.h1{font-family:var(--display);font-weight:900;font-size:clamp(26px,7vw,34px);line-height:1.1;text-wrap:balance}
.lede{color:var(--muted);text-wrap:pretty}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--display);font-size:16px;font-weight:700}
label{font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input:not([type]),input[type=tel],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px}
.btn{border:0;border-radius:14px;padding:14px 18px;background:var(--panel2);color:var(--text);font-weight:700;border:1px solid var(--line)}
.btn.hot{background:var(--hot);border-color:var(--hot);color:#fff}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--ink)}
.btn.big{padding:18px 22px;font-size:18px;font-family:var(--display);font-weight:700}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;border-radius:10px;font-size:14px}
a.btn{display:block;text-align:center;text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);padding:6px 12px 6px 6px;border-radius:99px;font-weight:600;font-size:14px}
.chip i{font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--c,var(--cyan));color:var(--ink);font-weight:800;font-size:12px}
.chip.done{border-color:var(--mint)} .chip.done::after{content:"✓";color:var(--mint);font-weight:800}
.kick{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:0 0 0 2px}
.qlabel{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.qt{font-family:var(--display);font-weight:700;font-size:clamp(20px,5.6vw,26px);line-height:1.25;text-wrap:balance}
.pill{display:inline-block;align-self:flex-start;padding:6px 14px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:14px}
.pill.ok{border-color:var(--mint);color:var(--mint)}

/* --- spectrum bar --- */
.scale{width:100%}
.ends{display:flex;justify-content:space-between;gap:16px;font-family:var(--display);font-weight:700;font-size:clamp(12px,3.2vw,15px);text-transform:uppercase;letter-spacing:.03em}
.ends span:first-child{color:var(--cyan)} .ends span:last-child{color:var(--hot);text-align:right}
.track-outer{padding:74px 22px 120px}
.track{position:relative;height:18px;border-radius:99px;background:linear-gradient(90deg,var(--cyan),#8d7bff 50%,var(--hot));box-shadow:0 0 0 4px rgba(255,255,255,.06)}
.track::before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(11,15,35,.5) calc(10% - 2px) 10%);}
.pin{position:absolute;left:50%;opacity:0;transform:translateX(-50%);transition:left .9s cubic-bezier(.2,1.35,.3,1) var(--d,0s),opacity .3s var(--d,0s)}
.pin.in{left:calc(var(--v)*1%);opacity:1}
.pin::before{content:"";position:absolute;left:50%;width:3px;margin-left:-1.5px;background:rgba(238,241,255,.55)}
.pin.guess{top:calc(100% + 8px + var(--lane,0)*38px)}
.pin.guess::before{bottom:100%;height:calc(8px + var(--lane,0)*38px)}
.pin.guess i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--c);color:var(--ink);font-style:normal;font-weight:800;border:3px solid var(--bg)}
.pin.guess.best i{box-shadow:0 0 0 4px var(--sun),0 0 24px var(--sun)}
.pin.actual{bottom:calc(100% + 10px);--d:1.2s}
.pin.actual::before{top:100%;height:10px}
.pin.actual b{display:grid;place-items:center;min-width:64px;height:48px;padding:0 12px;border-radius:14px;background:var(--hot);color:#fff;font-family:var(--display);font-size:24px;box-shadow:0 8px 30px rgba(255,79,109,.55)}

/* --- slider --- */
.rng{-webkit-appearance:none;appearance:none;width:100%;height:18px;border-radius:99px;background:linear-gradient(90deg,var(--cyan),#8d7bff 50%,var(--hot));outline-offset:8px;margin:14px 0}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;background:#fff;border:5px solid var(--sun);box-shadow:0 4px 14px rgba(0,0,0,.45)}
.rng::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:5px solid var(--sun)}
.bignum{font-family:var(--display);font-weight:900;font-size:64px;text-align:center;line-height:1}
.mini-ends{display:flex;justify-content:space-between;gap:12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.mini-ends span:first-child{color:var(--cyan)} .mini-ends span:last-child{color:var(--hot);text-align:right}

/* --- Aman's setup --- */
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.qcard.unset{opacity:.8;border-style:dashed}
.qtop{display:flex;gap:10px;align-items:flex-start}
.qnum{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--panel2);font-weight:800;font-size:13px;color:var(--muted)}
.qtop .qt2{flex:1;min-width:0;font-weight:600}
.x{flex:none;background:none;border:0;color:var(--muted);font-size:22px;line-height:1;padding:0 4px}
.qval{display:flex;align-items:center;gap:10px}
.qval b{font-family:var(--display);font-size:22px;min-width:2.2ch}
.qval small{color:var(--muted);flex:1}
.qcard:not(.unset) .qval b{color:var(--sun)}
.startbar{position:sticky;bottom:max(8px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;background:linear-gradient(transparent,var(--bg) 40%);padding-top:18px}
.startbar small{color:var(--muted);text-align:center}
details.card summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:15px}
.sugg{display:flex;flex-direction:column;gap:8px}
.sugg-item{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--sun);border-radius:14px;padding:10px 12px}
.sugg-item p{flex:1;min-width:0;font-weight:600}
.sugg-item small{display:block;color:var(--muted);font-weight:500}
.mine{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px dashed var(--hot);border-radius:16px;padding:14px 16px}
.warn{font-size:13px;color:var(--muted);text-align:center}
.btnrow{display:flex;gap:10px;flex-wrap:wrap} .btnrow .btn{flex:1}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100vw - 32px);text-align:center;background:var(--mint);color:var(--ink);font-weight:700;padding:10px 16px;border-radius:99px;z-index:70}
.toast.bad{background:var(--hot);color:#fff}
.net{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--hot);color:#fff;text-align:center;font-weight:700;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}

/* --- results --- */
.res{display:flex;flex-direction:column;gap:6px}
.res-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.res-row.best{border-color:var(--sun);background:var(--panel2)}
.res-row .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.res-row .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-row .g{color:var(--muted);font-variant-numeric:tabular-nums}
.res-row .pts{font-family:var(--display);font-weight:700;color:var(--mint);min-width:3.5ch;text-align:right}
.res-row .tot{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;height:min(46vh,360px);margin-top:8px}
.podium .step{flex:1;max-width:220px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;text-align:center;min-width:0}
.podium .bar{width:100%;border-radius:16px 16px 0 0;background:linear-gradient(var(--c),color-mix(in srgb,var(--c) 40%,var(--bg)));display:grid;place-items:start center;padding-top:12px;font-family:var(--display);font-weight:900;font-size:clamp(28px,5vw,56px);color:var(--ink)}
.podium .pname{font-family:var(--display);font-weight:700;font-size:clamp(14px,2.2vw,26px);overflow-wrap:anywhere}
.podium .psc{color:var(--muted);font-weight:700}

/* --- big screen (TV) --- */
body.tv .wrap{max-width:1500px;gap:clamp(12px,2vw,28px)}
.tvhead{display:flex;justify-content:space-between;align-items:center}
.tvhead .brand{font-size:clamp(14px,1.6vw,22px)} .tvhead .code{font-size:clamp(14px,1.6vw,22px)}
.tvsetup{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(16px,2.6vw,40px);align-items:stretch}
@media (max-width:900px){.tvsetup{grid-template-columns:1fr}}
.joinhero{display:flex;flex-direction:column;gap:clamp(8px,1.4vw,18px);justify-content:center}
.joinhero .qlabel{font-size:clamp(12px,1.4vw,20px)}
.url{font-family:var(--display);font-weight:700;font-size:clamp(16px,2.8vw,44px);color:var(--sun);overflow-wrap:anywhere;line-height:1.2}
.tiles{display:flex;gap:clamp(8px,1.4vw,20px)}
.tiles span{flex:1;max-width:clamp(60px,12vw,190px);aspect-ratio:1;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--hot);border-radius:clamp(12px,2vw,28px);font-family:var(--display);font-weight:900;font-size:clamp(36px,8vw,128px);color:#fff}
.side .cnt{font-family:var(--display);font-weight:700;font-size:clamp(16px,2vw,28px);color:var(--sun)}
.side{gap:clamp(10px,1.4vw,18px)}
.side .chips{min-height:48px}
.side small{color:var(--muted)}
.tvq{font-family:var(--display);font-weight:900;font-size:clamp(26px,5vw,68px);line-height:1.12;text-wrap:balance}
body.tv .h1{font-size:clamp(32px,4.2vw,72px)}
body.tv .podium{height:min(52vh,560px)}
body.tv .compact .tvq{font-size:clamp(22px,3.6vw,48px)}
body.tv .compact .track-outer{padding:64px 22px 110px}
.statusrow{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.statusrow .cnt{font-family:var(--display);font-weight:700;font-size:clamp(16px,2vw,28px);color:var(--sun)}
.tvgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:clamp(14px,2.4vw,36px);align-items:start}
@media (max-width:900px){.tvgrid{grid-template-columns:1fr}}
.opbar{display:flex;justify-content:flex-end;align-items:center;gap:14px}
.opbar small{color:var(--muted)}
.lockover{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;background:rgba(11,15,35,.82);z-index:40;backdrop-filter:blur(4px)}
.lockover span{font-family:var(--display);font-weight:900;font-size:min(36vw,300px);line-height:1;color:var(--sun)}
.lockover small{color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:clamp(14px,2vw,24px)}
.you-line{display:flex;justify-content:space-between;gap:12px;font-weight:700}
.bigpts{font-family:var(--display);font-weight:900;font-size:56px;text-align:center;color:var(--mint)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--sun);color:var(--ink);font-weight:800;font-size:12px}
@media (prefers-reduced-motion:reduce){.pin{transition:none}.pin.in{left:calc(var(--v)*1%)}}
</style>
</head>
<body>

<script>
(function(){
'use strict';

/* ---------- config ---------- */
const SB='https://qrfgbkgbwtojxcylmhtl.supabase.co/rest/v1/bday_game';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyZmdia2did3RvanhjeWxtaHRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NDkxNzYsImV4cCI6MjEwNzMyNTE3Nn0.e6evfxr3OKgANtbEbfAvO38nWCyeZHwxl9GDo-Sholc';
const SCALES={
  never:['Would Never Do','Would Definitely Do'],
  hates:['Hates It','Loves It'],
  idea:['Terrible Idea','Great Idea'],
  freq:['Never','Always'],
  me:['Not Me','Literally Me']
};
const SCALE_NAMES={never:'Would Never Do ↔ Would Definitely Do',hates:'Hates It ↔ Loves It',idea:'Terrible Idea ↔ Great Idea',freq:'Never ↔ Always',me:'Not Me ↔ Literally Me'};
const DEFAULTS=[
  ['How many days a week does {n} eat paratha?','Never','Every day'],
  ['{n} skips cooking and orders food.',...SCALES.freq],
  ['{n} calls Maggi a proper meal.',...SCALES.freq],
  ['{n} says "just one chai" and has three.',...SCALES.freq],
  ['{n} eats a 2-day-old leftover paratha.',...SCALES.never],
  ['{n} stays in the lab past midnight.',...SCALES.freq],
  ['{n} tells his parents "thesis almost done."',...SCALES.me],
  ['{n} skips a party for his advisor\'s late-night email.',...SCALES.never],
  ['{n} nods along in a talk he didn\'t understand.',...SCALES.freq],
  ['{n} says "my PhD will finish next year."',...SCALES.me],
  ['{n} cries during Bollywood climaxes.',...SCALES.freq],
  ['{n} says "5 minutes" and arrives 45 minutes late.',...SCALES.me],
  ['{n} fights to pay the bill.',...SCALES.hates],
  ['{n} uses "Mummy\'s calling" to escape a plan.',...SCALES.never],
  ['{n} replies in the family WhatsApp group.',...SCALES.freq],
  ['{n} does karaoke without being asked.',...SCALES.hates],
  ['{n} quits his PhD to start an AI startup.',...SCALES.never],
  ['{n} goes on a group trip.',...SCALES.idea],
  ['{n} wakes up before 8 AM on weekends.',...SCALES.never],
  ['{n} buys something just because it was on sale.',...SCALES.me]
];
const PALETTE=['#46C8FF','#FFD23F','#3DDC97','#FF9F43','#B28DFF','#FF7BAC','#7EE8FA','#C6F432'];
const LOCK_MS=5000, CAP_MS=60000;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const rid=n=>{const a='abcdefghijklmnopqrstuvwxyz0123456789';let s='';for(let i=0;i<n;i++)s+=a[Math.floor(Math.random()*a.length)];return s};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clean=s=>String(s||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
const colorFor=pid=>{let h=0;for(const c of String(pid))h=(h*31+c.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]};
const initial=n=>(String(n||'?').trim()[0]||'?').toUpperCase();
const tierPts=d=>d<=3?10:d<=8?7:d<=15?5:d<=25?3:d<=40?1:0;
function toast(msg,bad){ const t=document.createElement('div'); t.className='toast'+(bad?' bad':''); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function pop(big){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas'); c.width=innerWidth; c.height=innerHeight;
  c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60'; document.body.appendChild(c);
  const x=c.getContext('2d'), cols=['#FF4F6D','#FFD23F','#46C8FF','#3DDC97','#ffffff'], ps=[], n=big?170:90;
  for(let i=0;i<n;i++)ps.push({x:c.width/2,y:c.height*.35,vx:(Math.random()-.5)*(big?24:16),vy:-Math.random()*(big?18:13)-4,r:4+Math.random()*5,c:cols[i%5],rot:Math.random()*6,vr:(Math.random()-.5)*.4});
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.rot+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++t<150)requestAnimationFrame(f);else c.remove()})();
}

/* ---------- backend (plain REST, no library) ---------- */
async function api(method,qs,body,extra){
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),9000);
  try{
    const res=await fetch(SB+qs,{method,signal:ctl.signal,cache:'no-store',
      headers:Object.assign({apikey:KEY,Authorization:'Bearer '+KEY},body?{'Content-Type':'application/json'}:{},extra||{}),
      body:body?JSON.stringify(body):undefined});
    if(!res.ok)throw new Error('HTTP '+res.status);
    return method==='GET'?await res.json():null;
  } finally{clearTimeout(to)}
}

/* ---------- state ---------- */
const qs=new URLSearchParams(location.search);
const PREFILL=clean(qs.get('r'));
let VIEW=['tv','host','play'].includes(qs.get('v'))?qs.get('v'):'';
let ROOM=VIEW?PREFILL:'';
const base=location.origin+location.pathname;
const shortUrl=location.host+location.pathname.replace(/index\.html$/,'');
const app=$('#app');
let cache=new Map(), pending=new Map(), loaded=false, curSig='', pollP=null, fails=0, rq=false, looping=false;

const R=()=>{const r=cache.get('room:'+ROOM);return r&&r.data};
const hostRow=()=>{const r=cache.get('host:'+ROOM);return r&&r.data};
const keyRow=()=>{const r=cache.get('key:'+ROOM);return r&&r.data};
const rows=kind=>[...cache.values()].filter(r=>r.kind===kind);
const revealFor=qid=>{const r=cache.get('reveal:'+ROOM+':'+qid);return r&&r.data};
const answersOf=pid=>{const r=cache.get('ans:'+ROOM+':'+pid);return (r&&r.data.answers)||{}};
function players(){
  const gone=new Set(rows('gone').map(r=>r.id.split(':')[2])), tot={};
  rows('reveal').forEach(r=>(r.data.results||[]).forEach(x=>{tot[x.pid]=(tot[x.pid]||0)+(x.pts||0)}));
  return rows('player').map(r=>({pid:r.id.split(':')[2],name:r.data.name||'?',score:tot[r.id.split(':')[2]]||0}))
    .filter(p=>!gone.has(p.pid)).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));
}

function merge(data){
  const m=new Map(); data.forEach(r=>m.set(r.id,r));
  const now=Date.now();
  pending.forEach((p,id)=>{
    const s=m.get(id);
    if(now-p.t>15000||(s&&Date.parse(s.updated_at)>=Date.parse(p.row.updated_at)))pending.delete(id); else m.set(id,p.row);
  });
  cache=m;
}
function showNet(on){ $('#net').hidden=!on; }
function poll(){
  if(!ROOM)return Promise.resolve();
  if(pollP)return pollP;
  const f=(VIEW==='tv'||VIEW==='host')?'in.('+ROOM+','+ROOM+'S)':'eq.'+ROOM;
  pollP=api('GET','?select=id,room,kind,data,updated_at&room='+f)
    .then(d=>{merge(d);fails=0;loaded=true;showNet(false)})
    .catch(()=>{fails++;if(fails>=3)showNet(true)})
    .finally(()=>{pollP=null;queueRender()});
  return pollP;
}
async function refreshNow(){ if(pollP)await pollP; return poll(); }
async function put(id,kind,data,room){
  const row={id,room:room||ROOM,kind,data,updated_at:new Date().toISOString()};
  pending.set(id,{row,t:Date.now()}); cache.set(id,row); queueRender();
  for(let i=0;i<4;i++){
    try{ await api('POST','?on_conflict=id',[row],{Prefer:'resolution=merge-duplicates,return=minimal'}); return true; }
    catch(e){ await sleep(400*(i+1)); }
  }
  pending.delete(id); return false;
}
function queueRender(){ if(rq)return; rq=true; requestAnimationFrame(()=>{rq=false;render()}); }
function mount(sig,html,bind,keep){
  if(sig===curSig)return false;
  const y=keep&&curSig.split(':')[0]===sig.split(':')[0]?window.scrollY:0;
  curSig=sig; app.className=''; app.innerHTML=html; if(bind)bind(); window.scrollTo(0,y); return true;
}

function setText(el,t){ if(el&&el.textContent!==t)el.textContent=t; }

let eng={qi:-1,first:0,busy:false};
function tvEngine(){
  const r=R(); if(!r||r.phase!=='playing')return;
  const q=(r.questions||[])[r.qi]; if(!q)return;
  if(eng.qi!==r.qi)eng={qi:r.qi,first:0,busy:false};
  if(eng.busy)return;
  if(r.rphase==='guess'){
    const ps=players(), n=answered(ps,q.id).length;
    if(n>0&&!eng.first)eng.first=Date.now();
    if((ps.length>0&&n>=ps.length)||(eng.first&&Date.now()-eng.first>CAP_MS)){
      eng.busy=true; put('room:'+ROOM,'room',{...r,rphase:'locking',lockAt:Date.now()+LOCK_MS}).finally(()=>{eng.busy=false});
    }
  } else if(r.rphase==='locking'&&Date.now()>=(r.lockAt||0)){
    eng.busy=true; doReveal(false).finally(()=>{eng.busy=false});
  }
}
async function doReveal(manual){
  const r0=R(); if(!r0||r0.phase!=='playing'||r0.rphase==='reveal')return;
  if(manual){ if(eng.busy)return; eng.busy=true; }
  try{
    await refreshNow();
    const r=R(); if(!r||r.rphase==='reveal')return;
    const q=r.questions[r.qi], k=keyRow(), actual=k&&k.secrets?k.secrets[q.id]:null;
    if(actual==null){ toast('Missing the secret number for this question',true); return; }
    if(!revealFor(q.id)){
      const ps=players();
      const res=ps.map(p=>{const v=answersOf(p.pid)[q.id]; const val=v==null?null:v; return {pid:p.pid,name:p.name,value:val,dist:val==null?null:Math.abs(val-actual),pts:0,best:false}});
      const ds=res.filter(x=>x.dist!=null).map(x=>x.dist), bd=ds.length?Math.min(...ds):null;
      res.forEach(x=>{if(x.dist==null)return;x.best=x.dist===bd;x.pts=tierPts(x.dist)+(x.best?3:0)});
      const ok=await put('reveal:'+ROOM+':'+q.id,'reveal',{qid:q.id,actual,results:res});
      if(!ok){toast('Could not save the result. Try again.',true);return}
    }
    await put('room:'+ROOM,'room',{...R(),rphase:'reveal'});
  } finally{ if(manual)eng.busy=false; }
}

  const el=$('#sugg'); if(!el)return;
  const list=rows('sugg').filter(r=>!hHandled[r.id]);
  setHtml(el,list.length?'<h2 class="qlabel">Suggested by players ('+list.length+')</h2>'+list.map(r=>'<div class="sugg-item"><p>'+esc(r.data.text)+'<small>'+esc(r.data.left)+' ↔ '+esc(r.data.right)+' · from '+esc(r.data.by||'a player')+'</small></p><button class="btn sun sm" data-add data-sid="'+esc(r.id)+'">Add</button><button class="btn ghost sm" data-dismiss data-sid="'+esc(r.id)+'">Skip</button></div>').join(''):'');
}
function renderHost(){
  const r=R(), hn=r.hostName||'Aman';
  if(!hostOk()){
    mount('h-pin','<main class="wrap">'+pHead()+'<h1 class="h1">Birthday person</h1><p class="lede">Enter the host PIN from the person running the big screen.</p><section class="card"><label for="pin">Host PIN</label><input id="pin" type="tel" inputmode="numeric" maxlength="4" autocomplete="off"><button id="pinGo" class="btn hot big">Continue</button></section></main>',
      ()=>{ const go=()=>{const p=cache.get('pin:'+ROOM); if(p&&String(p.data.pin)===$('#pin').value.trim()){store.set('bday_ok_'+ROOM,'1');curSig='';render()}else toast('Wrong host PIN',true)}; $('#pinGo').onclick=go; $('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')go()}); });
    return;
  }
  if(!hInit)initHost();
  if(r.phase==='done'){ mount('h-done','<main class="wrap">'+pHead()+'<h1 class="h1">That\'s a wrap</h1><p class="lede">Check the big screen for the podium. You can close this page.</p></main>'); return; }
  if(r.phase==='playing'){
    const q=(r.questions||[])[r.qi];
    mount('h-live:'+r.qi,'<main class="wrap">'+pHead()+'<h1 class="h1">Game on</h1><p class="lede">Put your phone away. The big screen runs everything now. Bluff well.</p>'+(q?'<div class="card"><div class="qlabel">Question '+(r.qi+1)+' of '+r.questions.length+'</div><p class="qt">'+esc(q.text)+'</p></div>':'')+'</main>');
    return;
  }
  mount('h-setup:'+hq.map(q=>q.id).join(','),
    '<main class="wrap">'+pHead()+'<h1 class="h1">Set your secret numbers</h1><p class="lede">Drag each slider to where you really sit. Nobody sees these until the reveal. A question you leave untouched is skipped.</p>'+
    '<div class="sugg" id="sugg"></div><div id="qlist" style="display:flex;flex-direction:column;gap:12px">'+hq.map(qCard).join('')+'</div>'+
    '<details class="card"><summary>Add your own question</summary><div class="stack"><label for="nq-text">Statement</label><input id="nq-text" maxlength="120" placeholder="'+esc(hn)+' sings in the shower."><label for="nq-scale">Scale</label><select id="nq-scale">'+Object.keys(SCALES).map(k=>'<option value="'+k+'">'+SCALE_NAMES[k]+'</option>').join('')+'<option value="custom">Custom…</option></select><div id="nq-custom" class="stack" hidden style="margin-top:0"><input id="nq-left" maxlength="24" placeholder="Left end"><input id="nq-right" maxlength="24" placeholder="Right end"></div><button id="nq-add" class="btn sun">Add question</button></div></details>'+
    '<div class="startbar"><button id="rdy" class="btn hot big">Set at least one number</button><small id="startnote"></small></div></main>',
    bindHostSetup,true);
  patchStart(); patchSugg();
}
function bindHostSetup(){
  const ql=$('#qlist');
  const setSecret=el=>{ const card=el.closest('.qcard'); if(!card)return; const q=hq.find(x=>x.id===card.dataset.id); if(!q)return;
    q.secret=parseInt(el.value,10); card.classList.remove('unset'); setText(card.querySelector('[data-val]'),String(q.secret)); setText(card.querySelector('[data-hint]'),'Locked in'); patchStart(); saveHostSoon(); };
  ql.addEventListener('input',e=>{if(e.target.matches('[data-rng]'))setSecret(e.target)});
  ql.addEventListener('click',e=>{
    const f=e.target.closest('[data-fifty]'); if(f){const rng=f.closest('.qcard').querySelector('[data-rng]'); rng.value=50; setSecret(rng); return}
    const d=e.target.closest('[data-del]'); if(!d)return; const id=d.closest('.qcard').dataset.id; hq=hq.filter(q=>q.id!==id); saveHostSoon(0); queueRender();
  });
  $('#nq-scale').onchange=()=>{$('#nq-custom').hidden=$('#nq-scale').value!=='custom'};
  $('#nq-add').onclick=()=>{
    const text=($('#nq-text').value||'').trim(); if(!text)return toast('Write the statement first',true);
    const k=$('#nq-scale').value; let left,right;
    if(k==='custom'){left=($('#nq-left').value||'').trim()||'Never';right=($('#nq-right').value||'').trim()||'Always';} else {[left,right]=SCALES[k];}
    hq.push({id:'c'+rid(6),text,left,right,secret:null}); saveHostSoon(0); queueRender(); setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),60);
  };
  $('#sugg').addEventListener('click',e=>{
    const a=e.target.closest('[data-add]'), d=e.target.closest('[data-dismiss]'); const sid=(a||d)&&(a||d).dataset.sid; if(!sid)return;
    const row=cache.get(sid); hHandled[sid]=1;
    if(a&&row){ hq.push({id:'s'+rid(6),text:row.data.text,left:row.data.left,right:row.data.right,secret:null}); toast('Added at the bottom. Set its number.'); queueRender(); setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),60); }
    saveHostSoon(0); patchSugg();
  });
  $('#rdy').onclick=()=>{ hReady=!hReady; saveHostSoon(0); patchStart(); };
}

/* ---------- player phone ---------- */
function renderPlayer(){
  const r=R(), hn=r.hostName||'Aman', pid=store.get('bday_pid_'+ROOM);
  if(pid&&rows('gone').some(g=>g.id==='gone:'+ROOM+':'+pid)){ mount('p-gone','<main class="wrap">'+pHead()+'<h1 class="h1">You were removed</h1><p class="lede">The person running the big screen took you out of this room.</p></main>'); return; }
  const prow=pid&&cache.get('player:'+ROOM+':'+pid);
  if(!prow){
    mount('p-join','<main class="wrap">'+pHead()+'<h1 class="h1">Join the game</h1><p class="lede">Can you read '+esc(hn)+' better than your friends can?</p><section class="card"><label for="pname">Your name</label><input id="pname" maxlength="14" autocomplete="off" value="'+esc(store.get('bday_name')||'')+'"><button id="pjoin" class="btn sun big">Join</button></section></main>',
      ()=>{ const go=async()=>{const name=($('#pname').value||'').trim(); if(!name)return toast('Type your name',true);
        const dup=players().find(p=>p.name.toLowerCase()===name.toLowerCase()); if(dup&&!confirmDup){confirmDup=true;return toast('Someone named '+dup.name+' is in. Tap Join again if that is you, or add an initial.',true)}
        $('#pjoin').disabled=true; await joinAs(ROOM,dup&&confirmDup?dup.name:name,dup&&confirmDup?dup.pid:null); $('#pjoin').disabled=false;};
        let confirmDup=false; $('#pjoin').onclick=go; $('#pname').addEventListener('keydown',e=>{if(e.key==='Enter')go()}); });
    return;
  }
  const me=players().find(p=>p.pid===pid)||{name:prow.data.name,score:0,pid};
  if(r.phase==='setup'){
    mount('p-wait','<main class="wrap">'+pHead()+'<h1 class="h1">You\'re in, '+esc(me.name)+'.</h1><p class="lede" id="pwait"></p>'+
      '<section class="card"><h2>Suggest a question</h2><p class="lede">Something '+esc(hn)+' will have to dodge. '+esc(hn)+' decides if it goes in.</p><label for="sg-text">Statement</label><input id="sg-text" maxlength="120" placeholder="'+esc(hn)+' has stalked an ex online."><label for="sg-scale">Scale</label><select id="sg-scale">'+Object.keys(SCALES).map(k=>'<option value="'+k+'">'+SCALE_NAMES[k]+'</option>').join('')+'</select><button id="sg-send" class="btn sun">Send to '+esc(hn)+'</button></section>'+
      '<section><h2 class="qlabel" style="margin-bottom:8px">In the room</h2><div class="chips" id="chips"></div></section></main>',
      ()=>{ $('#sg-send').onclick=async()=>{const text=($('#sg-text').value||'').trim(); if(!text)return toast('Write the statement first',true); const [l,rr]=SCALES[$('#sg-scale').value];
        const ok=await put('sugg:'+ROOM+':'+rid(8),'sugg',{text,left:l,right:rr,by:me.name}); if(ok){$('#sg-text').value='';toast('Sent to '+hn)}else toast('Could not send. Try again.',true)}; });
    setText($('#pwait'),'Waiting for the game to start.');
    setHtml($('#chips'),chipsHtml());
    return;
  }
  if(r.phase==='done'){
    const ps=players(), rank=ps.findIndex(p=>p.pid===pid)+1;
    mount('p-done','<main class="wrap">'+pHead()+'<h1 class="h1">Final result</h1><div class="card" style="align-items:center;text-align:center"><div class="qlabel">You finished</div><div class="bigpts" style="color:var(--sun)">#'+rank+'</div><p class="lede">'+me.score+' points</p></div>'+
      '<div class="res">'+ps.map((p,i)=>'<div class="res-row'+(p.pid===pid?' best':'')+'" style="--c:'+colorFor(p.pid)+'"><span class="dot"></span><span class="nm">'+(i+1)+'. '+esc(p.name)+'</span><span></span><span class="tot">'+p.score+'</span></div>').join('')+'</div></main>',()=>{if(rank===1)pop(true)});
    return;
  }
  const q=(r.questions||[])[r.qi]; if(!q)return;
  const rev=revealFor(q.id), mine=answersOf(pid)[q.id];
  const head=pHead()+'<div class="qlabel">Question '+(r.qi+1)+' of '+r.questions.length+'</div><h1 class="qt">'+esc(q.text)+'</h1>';
  if(r.rphase==='reveal'){
    if(!rev){ mount('p-scoring:'+r.qi,'<main class="wrap">'+head+'<div class="card" style="text-align:center"><p class="lede">Scoring…</p></div></main>'); return; }
    const x=rev.results.find(y=>y.pid===pid)||{value:null,pts:0}, rank=players().findIndex(p=>p.pid===pid)+1;
    mount('p-r:'+r.qi,'<main class="wrap">'+head+scaleBar(q,pinsFrom(rev),rev.actual)+
      '<div class="card" style="text-align:center"><div class="qlabel">'+esc(hn)+' landed on</div><div class="bigpts" style="color:var(--hot)">'+rev.actual+'</div>'+
      '<div class="you-line"><span>You said</span><span>'+(x.value==null?'no guess':x.value)+'</span></div><div class="you-line"><span>This round</span><span style="color:var(--mint)">+'+x.pts+'</span></div><div class="you-line"><span>Total</span><span>'+me.score+' · rank '+rank+'</span></div>'+(x.best?'<span class="tag">Closest!</span>':'')+'</div>'+
      '<p class="warn">Look at the big screen for everyone\'s guesses.</p></main>',()=>{animatePins();if(x.best)setTimeout(()=>pop(false),1700)});
    return;
  }
  if(mine!=null){
    mount('p-l:'+r.qi,'<main class="wrap">'+head+'<div class="card" style="text-align:center"><div class="qlabel">Locked in</div><div class="bigpts" style="color:var(--sun)">'+mine+'</div><p class="lede" id="lstat"></p></div></main>');
    const ps=players(); setText($('#lstat'),r.rphase==='locking'?'Revealing in a moment…':answered(ps,q.id).length+' of '+ps.length+' locked in. Waiting for the rest.');
    return;
  }
  if(r.rphase!=='guess'){
    mount('p-late:'+r.qi,'<main class="wrap">'+head+'<div class="card" style="text-align:center"><p class="lede">This round already locked. Catch the next one.</p></div></main>');
    return;
  }
  mount('p-g:'+r.qi,'<main class="wrap">'+head+'<p class="lede">Where did '+esc(hn)+' place himself? Ask him anything, then drag.</p>'+
    '<div class="card"><div class="mini-ends"><span>'+esc(q.left)+'</span><span>'+esc(q.right)+'</span></div><input id="gr" type="range" class="rng" min="0" max="100" value="50" aria-label="Your guess"><div class="bignum" id="gv">50</div></div>'+
    '<button id="lock" class="btn sun big">Lock it in</button></main>',
    ()=>{ const gr=$('#gr'); gr.addEventListener('input',()=>setText($('#gv'),gr.value));
      $('#lock').onclick=async()=>{ const b=$('#lock'); b.disabled=true; b.textContent='Sending…';
        const ok=await put('ans:'+ROOM+':'+pid,'ans',{answers:{...answersOf(pid),[q.id]:parseInt(gr.value,10)}});
        if(!ok){b.disabled=false;b.textContent='Lock it in';toast('Did not send. Tap again.',true)} }; });
}

/* ---------- render / boot ---------- */
function render(){
  if(!ROOM){ mount('landing',landingHtml(),bindLanding); return; }
  if(!loaded){ mount('loading:'+VIEW,'<div class="center">Connecting…</div>'); return; }
  if(!cache.get('room:'+ROOM)){
    mount('noroom','<main class="wrap"><div class="brand">Spectrum Party</div><h1 class="h1">Room '+esc(ROOM)+' not found</h1><p class="lede">Check the code on the big screen and try again.</p><a class="btn sun" href="'+esc(base)+'">Back</a></main>'); return;
  }
  if(VIEW==='tv')renderTV(); else if(VIEW==='host')renderHost(); else renderPlayer();
}
function tick(){
  if(VIEW==='tv')tvEngine();
  const r=R(); if(r&&r.phase==='playing'&&VIEW==='tv')syncLock(r);
}
document.addEventListener('keydown',e=>{
  if(VIEW!=='tv'||e.target.matches('input,textarea,select,button'))return;
  if(e.code==='Space'||e.key==='Enter'){const b=$('#tvAct'); if(b&&!b.disabled){e.preventDefault();b.click()}}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
if(ROOM)enterRoom(VIEW); else render();
})();
</script>
</body>
</html>
