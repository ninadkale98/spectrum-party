<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F23">
<title>Kaun Banega Amanaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout concept: one dark "game show" stage. A big spectrum bar is the hero on every screen;
   pins (guesses) and one hot marker (the secret number) land on it. Phones get a single column,
   the big screen scales up with vw units. */
:root{
  --bg:#0B0F23; --panel:#141A3A; --panel2:#1B2350; --line:#2B3570;
  --text:#EEF1FF; --muted:#9AA5DC;
  --gold:#F5C84B; --gold2:#B8862B; --hot:#FF4F6D; --sun:#FFD23F; --mint:#3DDC97; --cyan:#46C8FF; --ink:#0B0F23;
  --display:'Unbounded',system-ui,sans-serif; --body:'Figtree',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(16px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));
  background:radial-gradient(1100px 640px at 50% -14%,rgba(86,116,255,.52),transparent 62%),radial-gradient(700px 500px at 100% 100%,rgba(255,79,109,.16),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(245,200,75,.10),transparent 60%),var(--bg);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;animation:twinkle 7s ease-in-out infinite alternate;
  background-image:radial-gradient(1.6px 1.6px at 8% 14%,rgba(255,255,255,.8),transparent 60%),radial-gradient(1.2px 1.2px at 22% 38%,rgba(255,255,255,.6),transparent 60%),radial-gradient(1.8px 1.8px at 37% 9%,rgba(255,235,170,.8),transparent 60%),radial-gradient(1.2px 1.2px at 51% 27%,rgba(255,255,255,.55),transparent 60%),radial-gradient(1.6px 1.6px at 64% 12%,rgba(255,255,255,.75),transparent 60%),radial-gradient(1.2px 1.2px at 78% 33%,rgba(255,235,170,.7),transparent 60%),radial-gradient(1.8px 1.8px at 91% 16%,rgba(255,255,255,.8),transparent 60%),radial-gradient(1.2px 1.2px at 15% 72%,rgba(255,255,255,.45),transparent 60%),radial-gradient(1.6px 1.6px at 44% 83%,rgba(255,255,255,.5),transparent 60%),radial-gradient(1.2px 1.2px at 71% 77%,rgba(255,235,170,.55),transparent 60%),radial-gradient(1.6px 1.6px at 93% 88%,rgba(255,255,255,.55),transparent 60%),radial-gradient(1.2px 1.2px at 3% 52%,rgba(255,255,255,.5),transparent 60%)}
@keyframes twinkle{from{opacity:.35}to{opacity:1}}
#app{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.center{display:grid;place-items:center;min-height:60vh;color:var(--muted);text-align:center}
.brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:linear-gradient(90deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .hl{font-style:normal;-webkit-text-fill-color:var(--gold)}
.brand::before{content:"A";display:inline-grid;place-items:center;width:28px;height:30px;flex:none;font-size:15px;font-weight:900;background:linear-gradient(160deg,#FFE9A6,var(--gold) 45%,var(--gold2));-webkit-text-fill-color:var(--ink);clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
.code{font-size:13px;color:var(--muted)} .code b{font-family:var(--display);color:var(--sun);letter-spacing:.12em;margin-left:4px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:4px 12px;flex-wrap:wrap}
.landing{min-height:calc(100svh - 48px);justify-content:center;text-align:center;align-items:stretch}
.landing>.brand{align-self:center}
.landing .lede{margin-left:auto;margin-right:auto;max-width:34ch}
.landing .card{text-align:left}
.logo{margin:4px 0 0;display:flex;flex-direction:column;align-items:center;line-height:1;font-family:var(--display)}
.logo .k{font-weight:700;font-size:clamp(15px,4.6vw,22px);letter-spacing:.34em;text-transform:uppercase;color:var(--muted);padding-left:.34em}
.logo .am{font-weight:900;font-size:clamp(44px,14.5vw,76px);letter-spacing:-.01em;text-transform:uppercase;margin-top:8px;color:#fff;text-shadow:0 6px 40px rgba(86,116,255,.55)}
.logo .am b{font-weight:900;background:linear-gradient(180deg,#FFF1BE,var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(245,200,75,.45))}
.h1.gold{background:linear-gradient(180deg,#fff,var(--sun));-webkit-background-clip:text;background-clip:text;color:transparent}
.h1{font-family:var(--display);font-weight:900;font-size:clamp(26px,7vw,34px);line-height:1.1;text-wrap:balance}
.lede{color:var(--muted);text-wrap:pretty}
.card{background:linear-gradient(180deg,rgba(34,45,108,.72),rgba(18,25,64,.88));border:1px solid rgba(130,150,255,.28);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 14px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07)}
.card h2{font-family:var(--display);font-size:16px;font-weight:700}
label{font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input:not([type]),input[type=tel],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px}
.btn{border-radius:14px;padding:14px 18px;background:linear-gradient(180deg,#26327a,#19225c);color:var(--text);font-weight:700;border:1px solid rgba(130,150,255,.35);box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .08s,filter .15s,box-shadow .08s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.hot{background:linear-gradient(180deg,#ff7088,#e63a5b);border-color:#ff9bb0;color:#fff}
.btn.sun{background:linear-gradient(180deg,#FFE493,var(--gold) 55%,#DFA52C);border-color:#ffeab0;color:var(--ink)}
.btn.big{padding:18px 22px;font-size:18px;font-family:var(--display);font-weight:700}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line)}
.btn.sm{padding:8px 12px;border-radius:10px;font-size:14px}
a.btn{display:block;text-align:center;text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);padding:6px 12px 6px 6px;border-radius:99px;font-weight:600;font-size:14px}
.chip i{font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--c,var(--cyan));color:var(--ink);font-weight:800;font-size:12px}
.chip.done{border-color:var(--mint)} .chip.done::after{content:"✓";color:var(--mint);font-weight:800}
.kick{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:0 0 0 2px}
.qlabel{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.qt{font-family:var(--display);font-weight:700;font-size:clamp(17px,4.9vw,24px);line-height:1.28;text-wrap:balance}
.pill{display:inline-block;align-self:flex-start;padding:6px 14px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:14px}
.pill.ok{border-color:var(--mint);color:var(--mint)}

/* --- spectrum bar --- */
.scale{width:100%}
.ends{display:flex;justify-content:space-between;gap:16px;font-family:var(--display);font-weight:700;font-size:clamp(12px,3.2vw,15px);text-transform:uppercase;letter-spacing:.03em}
.ends span:first-child{color:var(--cyan)} .ends span:last-child{color:var(--hot);text-align:right}
.track-outer{padding:74px 22px 120px}
.track{position:relative;height:18px;border-radius:99px;background:linear-gradient(90deg,var(--cyan),#8d7bff 50%,var(--hot));box-shadow:0 0 0 4px rgba(255,255,255,.06)}
.track::before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(11,15,35,.5) calc(10% - 2px) 10%);}
.pin{position:absolute;left:50%;opacity:0;transform:translateX(-50%);transition:left .9s cubic-bezier(.2,1.35,.3,1) var(--d,0s),opacity .3s var(--d,0s)}
.pin.in{left:calc(var(--v)*1%);opacity:1}
.pin::before{content:"";position:absolute;left:50%;width:3px;margin-left:-1.5px;background:rgba(238,241,255,.55)}
.pin.guess{top:calc(100% + 8px + var(--lane,0)*38px)}
.pin.guess::before{bottom:100%;height:calc(8px + var(--lane,0)*38px)}
.pin.guess i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--c);color:var(--ink);font-style:normal;font-weight:800;border:3px solid var(--bg)}
.pin.guess.best i{box-shadow:0 0 0 4px var(--sun),0 0 24px var(--sun)}
.pin.actual{bottom:calc(100% + 10px);--d:1.2s}
.pin.actual::before{top:100%;height:10px}
.pin.actual b{display:grid;place-items:center;min-width:64px;height:48px;padding:0 12px;border-radius:14px;background:var(--hot);color:#fff;font-family:var(--display);font-size:24px;box-shadow:0 8px 30px rgba(255,79,109,.55)}

/* --- slider --- */
.rng{-webkit-appearance:none;appearance:none;width:100%;height:20px;border-radius:99px;background:linear-gradient(90deg,var(--cyan),#8d7bff 50%,var(--hot));outline-offset:8px;margin:14px 0}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;background:#fff;border:5px solid var(--sun);box-shadow:0 4px 14px rgba(0,0,0,.45)}
.rng::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:5px solid var(--sun)}
.bignum{font-family:var(--display);font-weight:900;font-size:64px;text-align:center;line-height:1;background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:700;padding:0 2px;margin-top:-4px}
.ring{--f:1;width:clamp(120px,38vw,170px);aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--f)*1turn),rgba(255,255,255,.1) 0);display:grid;place-items:center;box-shadow:0 0 40px rgba(245,200,75,.25)}
.ring-in{width:80%;aspect-ratio:1;border-radius:50%;background:var(--bg);display:grid;place-content:center;text-align:center}
.ring-in b{font-family:var(--display);font-weight:900;font-size:clamp(40px,12vw,56px);line-height:1}
.ring-in small{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.pnum{font-family:var(--display);font-weight:900;font-size:44px;color:var(--gold);line-height:1}
/* quiz-show question banner */
.lz{--cut:clamp(14px,2.2vw,38px);padding:3px;background:linear-gradient(90deg,var(--gold2),#FFE9A6 50%,var(--gold2));clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% 50%,calc(100% - var(--cut)) 100%,var(--cut) 100%,0 50%)}
.lz-in{background:linear-gradient(180deg,#1d2a74,#0e1543);clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% 50%,calc(100% - var(--cut)) 100%,var(--cut) 100%,0 50%);padding:clamp(14px,1.8vw,30px) calc(var(--cut) * 1.5);text-align:center}
.lz .qt,.lz .tvq{margin:0}
.stp{display:flex;align-items:center;gap:clamp(10px,1.2vw,18px);font-size:clamp(15px,1.9vw,30px);font-weight:700}
.stp i{flex:none;display:grid;place-items:center;width:clamp(30px,3vw,48px);height:clamp(30px,3vw,48px);border-radius:50%;background:linear-gradient(160deg,#FFE9A6,var(--gold) 50%,var(--gold2));color:var(--ink);font-style:normal;font-family:var(--display);font-weight:900}
.mini-ends{display:flex;justify-content:space-between;gap:12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.mini-ends span:first-child{color:var(--cyan)} .mini-ends span:last-child{color:var(--hot);text-align:right}

/* --- Aman's setup --- */
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.qcard.unset{opacity:.8;border-style:dashed}
.qtop{display:flex;gap:10px;align-items:flex-start}
.qnum{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--panel2);font-weight:800;font-size:13px;color:var(--muted)}
.qtop .qt2{flex:1;min-width:0;font-weight:600}
.x{flex:none;background:none;border:0;color:var(--muted);font-size:22px;line-height:1;padding:0 4px}
.qval{display:flex;align-items:center;gap:10px}
.qval b{font-family:var(--display);font-size:22px;min-width:2.2ch}
.qval small{color:var(--muted);flex:1}
.qcard:not(.unset) .qval b{color:var(--sun)}
.startbar{position:sticky;bottom:max(8px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;background:linear-gradient(transparent,var(--bg) 40%);padding-top:18px}
.startbar small{color:var(--muted);text-align:center}
details.card summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:15px}
.sugg{display:flex;flex-direction:column;gap:8px}
.sugg-item{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--sun);border-radius:14px;padding:10px 12px}
.sugg-item p{flex:1;min-width:0;font-weight:600}
.sugg-item small{display:block;color:var(--muted);font-weight:500}
.mine{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px dashed var(--hot);border-radius:16px;padding:14px 16px}
.warn{font-size:13px;color:var(--muted);text-align:center}
.btnrow{display:flex;gap:10px;flex-wrap:wrap} .btnrow .btn{flex:1}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100vw - 32px);text-align:center;background:var(--mint);color:var(--ink);font-weight:700;padding:10px 16px;border-radius:99px;z-index:70}
.toast.bad{background:var(--hot);color:#fff}
.net{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--hot);color:#fff;text-align:center;font-weight:700;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}

/* --- results --- */
.res{display:flex;flex-direction:column;gap:6px}
.res-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:linear-gradient(180deg,rgba(34,45,108,.7),rgba(20,27,70,.85));border:1px solid rgba(130,150,255,.25);border-radius:12px;padding:8px 12px}
.res-row.best{border-color:var(--gold);background:linear-gradient(180deg,rgba(90,80,40,.55),rgba(40,36,30,.8));box-shadow:0 0 24px rgba(245,200,75,.18)}
.res-row .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.res-row .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-row .g{color:var(--muted);font-variant-numeric:tabular-nums}
.res-row .pts{font-family:var(--display);font-weight:700;color:var(--mint);min-width:3.5ch;text-align:right}
.res-row .tot{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.podium{display:flex;align-items:stretch;justify-content:center;gap:12px;height:min(46vh,360px);margin-top:8px}
.podium .step{flex:1;max-width:220px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;text-align:center;min-width:0}
.podium .bar{width:100%;height:calc((100% - 64px)*var(--k,1));border-radius:16px 16px 0 0;background:linear-gradient(var(--c),color-mix(in srgb,var(--c) 40%,var(--bg)));display:grid;place-items:start center;padding-top:12px;font-family:var(--display);font-weight:900;font-size:clamp(28px,5vw,56px);color:var(--ink)}
.podium .pname{font-family:var(--display);font-weight:700;font-size:clamp(14px,2.2vw,26px);overflow-wrap:anywhere}
.podium .psc{color:var(--muted);font-weight:700}

/* --- big screen (TV) --- */
body.tv .wrap{max-width:1500px;gap:clamp(12px,2vw,28px)}
.tvhead{display:flex;justify-content:space-between;align-items:center}
.tvhead .brand{font-size:clamp(14px,1.6vw,22px)} .tvhead .code{font-size:clamp(14px,1.6vw,22px)}
.tvsetup{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(16px,2.6vw,40px);align-items:center;min-height:min(72vh,780px)}
@media (max-width:900px){.tvsetup{grid-template-columns:1fr}}
.joinhero{display:flex;flex-direction:column;gap:clamp(8px,1.4vw,18px);justify-content:center}
.joinhero .qlabel{font-size:clamp(12px,1.4vw,20px)}
.url{font-family:var(--display);font-weight:700;font-size:clamp(16px,2.8vw,44px);color:var(--sun);overflow-wrap:anywhere;line-height:1.2}
.tiles{display:flex;gap:clamp(8px,1.4vw,20px)}
.tiles span{flex:1;max-width:clamp(60px,12vw,190px);aspect-ratio:1;display:grid;place-items:center;background:var(--panel2);border:2px solid var(--hot);border-radius:clamp(12px,2vw,28px);font-family:var(--display);font-weight:900;font-size:clamp(36px,8vw,128px);color:#fff}
.side .cnt{font-family:var(--display);font-weight:700;font-size:clamp(16px,2vw,28px);color:var(--sun)}
.side{gap:clamp(10px,1.4vw,18px)}
.side .chips{min-height:48px}
.side small{color:var(--muted)}
.tvq{font-family:var(--display);font-weight:900;font-size:clamp(24px,3.9vw,64px);line-height:1.14;text-wrap:balance}
body.tv .h1{font-size:clamp(32px,4.2vw,72px)}
body.tv .podium{height:min(52vh,560px)}
body.tv .compact .tvq{font-size:clamp(20px,3vw,44px)}
body.tv .compact .track-outer{padding:64px 22px 110px}
.statusrow{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.statusrow .cnt{font-family:var(--display);font-weight:700;font-size:clamp(16px,2vw,28px);color:var(--sun)}
.tvgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:clamp(14px,2.4vw,36px);align-items:start}
@media (max-width:900px){.tvgrid{grid-template-columns:1fr}}
.opbar{display:flex;justify-content:flex-end;align-items:center;gap:14px}
.opbar small{color:var(--muted)}
.lockover{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;background:rgba(11,15,35,.82);z-index:40;backdrop-filter:blur(4px)}
.drum{font-size:min(22vw,200px);line-height:1;animation:drum .12s linear infinite alternate;filter:drop-shadow(0 0 30px rgba(245,200,75,.5))}
@keyframes drum{from{transform:rotate(-7deg) scale(1)}to{transform:rotate(7deg) scale(1.06)}}
.lockover span{font-family:var(--display);font-weight:900;font-size:min(9vw,110px);line-height:1;color:var(--gold);margin-top:8px}
.lockover small{color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:clamp(14px,2vw,24px)}
.you-line{display:flex;justify-content:space-between;gap:12px;font-weight:700}
.bigpts{font-family:var(--display);font-weight:900;font-size:56px;text-align:center;color:var(--mint)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--sun);color:var(--ink);font-weight:800;font-size:12px}
@media (prefers-reduced-motion:reduce){.pin{transition:none}.pin.in{left:calc(var(--v)*1%)}}

/* --- how-to-play intro (big screen) --- */
.intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:4vw 5vw 7vw;overflow:hidden;background:radial-gradient(1400px 800px at 50% 25%,#26358a 0%,#0B0F23 68%)}
.scene{width:min(1500px,100%);display:flex;flex-direction:column;align-items:center;gap:clamp(16px,2.6vw,44px);text-align:center;animation:sceneIn .7s ease both}
@keyframes sceneIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.i-kicker{font-family:var(--display);font-weight:700;font-size:clamp(12px,1.6vw,26px);letter-spacing:.3em;text-transform:uppercase;color:var(--cyan)}
.i-title{font-family:var(--display);font-weight:900;font-size:clamp(38px,8.2vw,140px);line-height:1.04;background:linear-gradient(180deg,#fff 20%,var(--sun));-webkit-background-clip:text;background-clip:text;color:transparent}
.i-sub{font-size:clamp(18px,2.6vw,44px);color:var(--muted)}
.i-cap{font-family:var(--display);font-weight:700;font-size:clamp(20px,3.1vw,54px);line-height:1.22;text-wrap:balance;max-width:26em}
.i-card{width:min(1100px,100%);background:var(--panel);border:1px solid var(--line);border-radius:clamp(16px,2vw,32px);padding:clamp(18px,2.6vw,44px);display:flex;flex-direction:column;gap:clamp(10px,1.6vw,26px)}
.i-state{font-size:clamp(18px,2.6vw,44px);font-weight:700}
.i-bar{position:relative;height:clamp(14px,1.6vw,24px);border-radius:99px;background:linear-gradient(90deg,var(--cyan),#8d7bff 50%,var(--hot));margin:clamp(40px,5vw,80px) 0 clamp(8px,1vw,16px)}
.i-q{position:absolute;left:72%;bottom:100%;transform:translateX(-50%);display:grid;place-items:center;width:clamp(44px,5vw,84px);height:clamp(44px,5vw,84px);border-radius:50%;background:var(--sun);color:var(--ink);font-family:var(--display);font-weight:900;font-size:clamp(22px,3vw,52px);animation:dropIn 1s cubic-bezier(.3,1.5,.5,1) 1.4s both}
@keyframes dropIn{from{opacity:0;transform:translate(-50%,-120px)}to{opacity:1;transform:translate(-50%,0)}}
.i-chat{width:min(1100px,100%);display:flex;flex-direction:column;gap:clamp(8px,1.2vw,18px)}
.b{max-width:76%;padding:clamp(10px,1.2vw,20px) clamp(14px,1.8vw,28px);border-radius:clamp(14px,1.6vw,26px);font-size:clamp(16px,2.2vw,38px);text-align:left;animation:popIn .5s var(--d,0s) both}
.b b{display:block;font-size:.6em;letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin-bottom:2px}
.b.them{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.b.him{align-self:flex-end;background:var(--hot);color:#fff}
.i-phone{width:min(520px,70vw);background:var(--panel);border:3px solid var(--line);border-radius:clamp(22px,2.6vw,42px);padding:clamp(16px,2vw,32px);display:flex;flex-direction:column;gap:clamp(8px,1.2vw,18px)}
.i-ph-q{font-family:var(--display);font-weight:700;font-size:clamp(14px,1.8vw,28px)}
.i-ph-ends{display:flex;justify-content:space-between;font-size:clamp(11px,1.2vw,19px);font-weight:700;text-transform:uppercase}
.i-ph-ends span:first-child{color:var(--cyan)} .i-ph-ends span:last-child{color:var(--hot)}
.i-ph-track{position:relative;height:clamp(12px,1.3vw,20px);border-radius:99px;background:linear-gradient(90deg,var(--cyan),#8d7bff 50%,var(--hot));margin:clamp(10px,1.4vw,22px) 0}
.i-knob{position:absolute;top:50%;left:68%;width:clamp(30px,3.2vw,52px);height:clamp(30px,3.2vw,52px);margin:calc(clamp(30px,3.2vw,52px)/-2) 0 0 calc(clamp(30px,3.2vw,52px)/-2);border-radius:50%;background:#fff;border:clamp(4px,.5vw,8px) solid var(--sun);animation:slide 3s cubic-bezier(.5,0,.2,1) .6s both}
@keyframes slide{from{left:12%}to{left:68%}}
.i-ph-num{font-family:var(--display);font-weight:900;font-size:clamp(34px,4.6vw,76px);line-height:1}
.i-ph-btn{background:var(--sun);color:var(--ink);font-family:var(--display);font-weight:700;border-radius:clamp(12px,1.4vw,22px);padding:clamp(10px,1.2vw,20px);font-size:clamp(14px,1.8vw,30px);animation:pulse 1s ease-in-out 3.8s 3}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 0 12px rgba(255,210,63,.25)}}
.i-reveal{width:min(1250px,100%)}
.i-tiers{width:min(900px,100%);display:flex;flex-direction:column;gap:clamp(6px,.9vw,14px)}
.i-tiers div{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:clamp(10px,1.2vw,20px);padding:clamp(8px,1vw,16px) clamp(16px,2vw,32px);font-size:clamp(16px,2.1vw,36px);font-weight:700;animation:popIn .45s var(--d,0s) both}
.i-tiers b{font-family:var(--display);color:var(--mint)}
.i-tiers .bonus{border-color:var(--sun);background:var(--panel2)} .i-tiers .bonus b{color:var(--sun)}
.i-dots{position:fixed;left:50%;bottom:max(24px,2.4vw);transform:translateX(-50%);display:flex;gap:10px}
.i-dots i{width:clamp(8px,.9vw,14px);height:clamp(8px,.9vw,14px);border-radius:50%;background:var(--line)} .i-dots i.on{background:var(--sun)}
.i-skip{position:fixed;right:max(20px,2vw);bottom:max(18px,2vw);display:flex;align-items:center;gap:12px;color:var(--muted);font-size:clamp(12px,1.2vw,18px)}
@media (prefers-reduced-motion:reduce){.scene,.b,.i-tiers div,.i-q,.i-knob,.i-ph-btn{animation:none}}

</style>

  const x=c.getContext('2d'), ps=[], n=big?55:26, sz=Math.max(30,Math.min(innerWidth,innerHeight)/(big?15:18));
  for(let i=0;i<n;i++)ps.push({x:c.width/2,y:c.height*.4,vx:(Math.random()-.5)*(big?26:17),vy:-Math.random()*(big?19:13)-4,r:sz*(.55+Math.random()*.7),rot:(Math.random()-.5)*.8,vr:(Math.random()-.5)*.16});
  const hasFace=FACE.complete&&FACE.naturalWidth>0; let t=0;
  (function f(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.vy+=.4;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.rot+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.rot);
      if(hasFace)x.drawImage(FACE,-p.r/2,-p.r/2,p.r,p.r); else {x.fillStyle='#FFD23F';x.beginPath();x.arc(0,0,p.r/2,0,7);x.fill()}
      x.restore()});
    if(++t<240)requestAnimationFrame(f); else c.remove();
  })();
}

/* ---------- backend (plain REST, no library) ---------- */
async function api(method,qs,body,extra){
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),9000);
  try{
    const res=await fetch(SB+qs,{method,signal:ctl.signal,cache:'no-store',
      headers:Object.assign({apikey:KEY,Authorization:'Bearer '+KEY},body?{'Content-Type':'application/json'}:{},extra||{}),
      body:body?JSON.stringify(body):undefined});
    if(!res.ok)throw new Error('HTTP '+res.status);
    return method==='GET'?await res.json():null;
  } finally{clearTimeout(to)}
}

function players(){

function merge(data){
  const m=new Map(); data.forEach(r=>m.set(r.id,r));
  const now=Date.now();
  pending.forEach((p,id)=>{
    const s=m.get(id);
    if(now-p.t>15000||(s&&Date.parse(s.updated_at)>=Date.parse(p.row.updated_at)))pending.delete(id); else m.set(id,p.row);
  });
  cache=m;
}

function poll(){

  pollP=api('GET','?select=id,room,kind,data,updated_at&room='+f)
    .then(d=>{merge(d);fails=0;loaded=true;showNet(false)})
    .catch(()=>{fails++;if(fails>=3)showNet(true)})
    .finally(()=>{pollP=null;queueRender()});

}

async function put(id,kind,data,room){
  const row={id,room:room||ROOM,kind,data,updated_at:new Date().toISOString()};
  pending.set(id,{row,t:Date.now()}); cache.set(id,row); queueRender();
  for(let i=0;i<4;i++){
    try{ await api('POST','?on_conflict=id',[row],{Prefer:'resolution=merge-duplicates,return=minimal'}); return true; }
    catch(e){ await sleep(400*(i+1)); }

}

let _ac=null, _drumOn=false;
function audio(){ try{ _ac=_ac||new (window.AudioContext||window.webkitAudioContext)(); if(_ac.state==='suspended')_ac.resume(); }catch(e){} return _ac }
['pointerdown','keydown'].forEach(ev=>window.addEventListener(ev,()=>{ if(VIEW==='tv')audio() },{passive:true}));
function drumRoll(ms){
  const ac=audio(); if(!ac)return; try{
  const t0=ac.currentTime+.02, dur=ms/1000-.5, g=ac.createGain(); g.connect(ac.destination);
  const nb=ac.createBuffer(1,ac.sampleRate*.12,ac.sampleRate), d=nb.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  for(let t=0,i=0;t<dur;i++){ const step=Math.max(.045,.14-.1*(t/dur));
    const src=ac.createBufferSource(); src.buffer=nb; const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1800; const v=ac.createGain();
    v.gain.value=.25+.55*(t/dur); src.connect(f); f.connect(v); v.connect(g); src.start(t0+t); t+=step; }
  const o=ac.createOscillator(), og=ac.createGain(); o.type='sine'; o.frequency.setValueAtTime(110,t0); o.frequency.exponentialRampToValueAtTime(60,t0+dur);
  og.gain.setValueAtTime(.0001,t0); og.gain.linearRampToValueAtTime(.5,t0+dur); og.gain.exponentialRampToValueAtTime(.0001,t0+dur+.4); o.connect(og); og.connect(g); o.start(t0); o.stop(t0+dur+.45);
  // final crash
  const c=ac.createBufferSource(), cb=ac.createBuffer(1,ac.sampleRate*.9,ac.sampleRate), cd=cb.getChannelData(0); for(let i=0;i<cd.length;i++)cd[i]=(Math.random()*2-1)*Math.pow(1-i/cd.length,3);
  c.buffer=cb; const cg=ac.createGain(); cg.gain.value=.7; c.connect(cg); cg.connect(ac.destination); c.start(t0+dur+.05);
  }catch(e){} }

let eng={qi:-1,first:0,busy:false};
function tvEngine(){
  const r=R(); if(!r||r.phase!=='playing')return;
  const q=(r.questions||[])[r.qi]; if(!q)return;
  if(eng.qi!==r.qi)eng={qi:r.qi,first:0,busy:false};
  if(eng.busy)return;
  if(r.rphase==='guess'){
    const ps=players(), n=answered(ps,q.id).length;
    if(n>0&&!eng.first)eng.first=Date.now();
    if((ps.length>0&&n>=ps.length)||(eng.first&&Date.now()-eng.first>CAP_MS)){
      eng.busy=true; put('room:'+ROOM,'room',{...r,rphase:'locking',lockAt:Date.now()+LOCK_MS}).finally(()=>{eng.busy=false});
    }
  } else if(r.rphase==='locking'&&Date.now()>=(r.lockAt||0)){
    eng.busy=true; doReveal(false).finally(()=>{eng.busy=false});
  }
}
async function doReveal(manual){
  const r0=R(); if(!r0||r0.phase!=='playing'||r0.rphase==='reveal')return;
  if(manual){ if(eng.busy)return; eng.busy=true; }
  try{
    await refreshNow();
    const r=R(); if(!r||r.rphase==='reveal')return;
    const q=r.questions[r.qi], k=keyRow(), actual=k&&k.secrets?k.secrets[q.id]:null;
    if(actual==null){ toast('Missing the secret number for this question',true); return; }
    if(!revealFor(q.id)){
      const ps=players();
      const res=ps.map(p=>{const v=answersOf(p.pid)[q.id]; const val=v==null?null:v; return {pid:p.pid,name:p.name,value:val,dist:val==null?null:Math.abs(val-actual),pts:0,best:false}});
      const ds=res.filter(x=>x.dist!=null).map(x=>x.dist), bd=ds.length?Math.min(...ds):null;
      res.forEach(x=>{if(x.dist==null)return;x.best=x.dist===bd;x.pts=tierPts(x.dist)+(x.best?3:0)});
      const ok=await put('reveal:'+ROOM+':'+q.id,'reveal',{qid:q.id,actual,results:res});
      if(!ok){toast('Could not save the result. Try again.',true);return}
    }

}

  }
  if(pend){
    mount('p-pend:'+r.qi,'<main class="wrap">'+head+'<div class="card" style="align-items:center;text-align:center"><div class="qlabel">Locking in…</div><div class="ring" id="ring" style="--f:1"><div class="ring-in"><b id="pnum">5</b><small>sec</small></div></div><div class="pnum">'+pend.value+'</div><p class="lede">Your guess locks for good when the timer ends.</p></div><button id="chg" class="btn big">Change my answer</button></main>',
      ()=>{ $('#chg').onclick=()=>{cancelPend();curSig='';render()}; });
    return;
  }
  if(r.rphase!=='guess'){
    mount('p-late:'+r.qi,'<main class="wrap">'+head+'<div class="card" style="text-align:center"><p class="lede">This round already locked. Catch the next one.</p></div></main>');
    return;
  }
  const dv=draft[q.id]!=null?draft[q.id]:50;
  mount('p-g:'+r.qi,'<main class="wrap">'+head+'<p class="lede">Where did '+esc(hn)+' place himself? Ask him anything, then drag.</p>'+
    '<div class="card"><div class="mini-ends"><span>'+esc(q.left)+'</span><span>'+esc(q.right)+'</span></div><input id="gr" type="range" class="rng" min="0" max="100" value="'+dv+'" aria-label="Your guess"><div class="ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div><div class="bignum" id="gv">'+dv+'</div></div>'+
    '<button id="lock" class="btn sun big">Lock it in</button><p class="warn">After you tap, you get 5 seconds to change your mind.</p></main>',
    ()=>{ const gr=$('#gr'); gr.addEventListener('input',()=>{setText($('#gv'),gr.value);draft[q.id]=parseInt(gr.value,10)});
      $('#lock').onclick=()=>startPend(q,parseInt(gr.value,10)); });
}

/* ---------- render / boot ---------- */
function render(){
  if(!ROOM){ mount('landing',landingHtml(),bindLanding); return; }
  if(!loaded){ mount('loading:'+VIEW,'<div class="center">Connecting…</div>'); return; }
  if(!cache.get('room:'+ROOM)){
    mount('noroom','<main class="wrap"><div class="brand">Kaun Banega Amanaire</div><h1 class="h1">Room '+esc(ROOM)+' not found</h1><p class="lede">Check the code on the big screen and try again.</p><a class="btn sun" href="'+esc(base)+'">Back</a></main>'); return;
  }
  if(VIEW==='tv')renderTV(); else if(VIEW==='host')renderHost(); else renderPlayer();
}
function tick(){
  if(VIEW==='tv')tvEngine();
  const r=R(); if(r&&r.phase==='playing'&&VIEW==='tv')syncLock(r);
}
document.addEventListener('keydown',e=>{
  if(VIEW==='tv'&&intro){
    if(e.code==='Space'||e.key==='Enter'||e.key==='Escape'){e.preventDefault();endIntro();}
    else if(e.key==='ArrowRight'){e.preventDefault();showScene(intro.i+1);}
    else if(e.key==='ArrowLeft'){e.preventDefault();showScene(intro.i-1);}
    return;
  }
  if(VIEW!=='tv'||e.target.matches('input,textarea,select,button'))return;
  if(e.code==='Space'||e.key==='Enter'){const b=$('#tvAct'); if(b&&!b.disabled){e.preventDefault();b.click()}}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
if(ROOM)enterRoom(VIEW); else render();
})();
</script>
</body>
</html>
