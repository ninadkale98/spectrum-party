<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0F23">
<title>Kaun Banega Amanaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout concept: one dark "game show" stage. A big spectrum bar is the hero on every screen;
   pins (guesses) and one hot marker (the secret number) land on it. Phones get a single column,
   the big screen scales up with vw units. */
:root{
  --bg:#0B0F23; --panel:#141A3A; --panel2:#1B2350; --line:#2B3570;
  --text:#EEF1FF; --muted:#9AA5DC;
  --gold:#F5C84B; --gold2:#B8862B; --hot:#FF4F6D; --sun:#FFD23F; --mint:#3DDC97; --cyan:#46C8FF; --ink:#0B0F23;
  --display:'Unbounded',system-ui,sans-serif; --body:'Figtree',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(16px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));
  background:radial-gradient(1100px 640px at 50% -14%,rgba(86,116,255,.52),transparent 62%),radial-gradient(700px 500px at 100% 100%,rgba(255,79,109,.16),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(245,200,75,.10),transparent 60%),var(--bg);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;animation:twinkle 7s ease-in-out infinite alternate;
  background-image:radial-gradient(1.6px 1.6px at 8% 14%,rgba(255,255,255,.8),transparent 60%),radial-gradient(1.2px 1.2px at 22% 38%,rgba(255,255,255,.6),transparent 60%),radial-gradient(1.8px 1.8px at 37% 9%,rgba(255,235,170,.8),transparent 60%),radial-gradient(1.2px 1.2px at 51% 27%,rgba(255,255,255,.55),transparent 60%),radial-gradient(1.6px 1.6px at 64% 12%,rgba(255,255,255,.75),transparent 60%),radial-gradient(1.2px 1.2px at 78% 33%,rgba(255,235,170,.7),transparent 60%),radial-gradient(1.8px 1.8px at 91% 16%,rgba(255,255,255,.8),transparent 60%),radial-gradient(1.2px 1.2px at 15% 72%,rgba(255,255,255,.45),transparent 60%),radial-gradient(1.6px 1.6px at 44% 83%,rgba(255,255,255,.5),transparent 60%),radial-gradient(1.2px 1.2px at 71% 77%,rgba(255,235,170,.55),transparent 60%),radial-gradient(1.6px 1.6px at 93% 88%,rgba(255,255,255,.55),transparent 60%),radial-gradient(1.2px 1.2px at 3% 52%,rgba(255,255,255,.5),transparent 60%)}
@keyframes twinkle{from{opacity:.35}to{opacity:1}}
#app{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.center{display:grid;place-items:center;min-height:60vh;color:var(--muted);text-align:center}
.brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:linear-gradient(90deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .hl{font-style:normal;-webkit-text-fill-color:var(--gold)}
.brand::before{content:"A";display:inline-grid;place-items:center;width:28px;height:30px;flex:none;font-size:15px;font-weight:900;background:linear-gradient(160deg,#FFE9A6,var(--gold) 45%,var(--gold2));-webkit-text-fill-color:var(--ink);clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
.code{font-size:13px;color:var(--muted)} .code b{font-family:var(--display);color:var(--sun);letter-spacing:.12em;margin-left:4px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:4px 12px;flex-wrap:wrap}
.landing{min-height:calc(100svh - 48px);justify-content:center;text-align:center;align-items:stretch}
.landing>.brand{align-self:center}
.landing .lede{margin-left:auto;margin-right:auto;max-width:34ch}
.landing .card{text-align:left}
.logo{margin:4px 0 0;padding:0 16px;max-width:100%;display:flex;flex-direction:column;align-items:center;line-height:1;font-family:var(--display)}
.logo .k{font-weight:700;font-size:clamp(15px,4.6vw,22px);letter-spacing:.34em;text-transform:uppercase;color:var(--muted);padding-left:.34em}
.logo .am{font-weight:900;font-size:clamp(30px,11.6vw,76px);letter-spacing:-.01em;text-transform:uppercase;margin-top:8px;color:#fff;text-shadow:0 6px 40px rgba(86,116,255,.55)}
.logo .am b{font-weight:900;background:linear-gradient(180deg,#FFF1BE,var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(245,200,75,.45))}
.h1.gold{background:linear-gradient(180deg,#fff,var(--sun));-webkit-background-clip:text;background-clip:text;color:transparent}
.h1{font-family:var(--display);font-weight:900;font-size:clamp(26px,7vw,34px);line-height:1.1;text-wrap:balance}
.lede{color:var(--muted);text-wrap:pretty}
.card{background:linear-gradient(180deg,rgba(34,45,108,.72),rgba(18,25,64,.88));border:1px solid rgba(130,150,255,.28);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 14px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07)}
.card h2{font-family:var(--display);font-size:16px;font-weight:700}
label{font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input:not([type]),input[type=tel],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px}
.btn{border-radius:14px;padding:14px 18px;background:linear-gradient(180deg,#26327a,#19225c);color:var(--text);font-weight:700;border:1px solid rgba(130,150,255,.35);box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .08s,filter .15s,box-shadow .08s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.hot{background:linear-gradient(180deg,#ff7088,#e63a5b);border-color:#ff9bb0;color:#fff}
.btn.sun{background:linear-gradient(180deg,#FFE493,var(--gold) 55%,#DFA52C);border-color:#ffeab0;color:var(--ink)}
.btn.big{padding:18px 22px;font-size:18px;font-family:var(--display);font-weight:700}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line)}
.btn.sm{padding:8px 12px;border-radius:10px;font-size:14px}
a.btn{display:block;text-align:center;text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);padding:6px 12px 6px 6px;border-radius:99px;font-weight:600;font-size:14px}
.chip i{font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--c,var(--cyan));color:var(--ink);font-weight:800;font-size:12px}
.chip.done{border-color:var(--mint)} .chip.done::after{content:"✓";color:var(--mint);font-weight:800}
.kick{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:0 0 0 2px}
.chip.armed{border-color:var(--hot)} .chip.armed .kick{color:var(--hot);font-size:13px;font-weight:800}
.qlabel{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.qt{font-family:var(--display);font-weight:700;font-size:clamp(17px,4.9vw,24px);line-height:1.28;text-wrap:balance}
.pill{display:inline-block;align-self:flex-start;padding:6px 14px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:14px}
.pill.ok{border-color:var(--mint);color:var(--mint)}

/* --- spectrum bar --- */
.scale{width:100%}
.ends{display:flex;justify-content:space-between;gap:16px;font-family:var(--display);font-weight:700;font-size:clamp(12px,3.2vw,15px);text-transform:uppercase;letter-spacing:.03em}
.ends span:first-child{color:var(--cyan)} .ends span:last-child{color:var(--hot);text-align:right}
.track-outer{padding:74px 22px 120px}
.track{position:relative;height:18px;border-radius:99px;background:linear-gradient(90deg,var(--cyan),#8d7bff 50%,var(--hot));box-shadow:0 0 0 4px rgba(255,255,255,.06)}
.track::before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(11,15,35,.5) calc(10% - 2px) 10%);}
.pin{position:absolute;left:50%;opacity:0;transform:translateX(-50%);transition:left .9s cubic-bezier(.2,1.35,.3,1) var(--d,0s),opacity .3s var(--d,0s)}
.pin.in{left:calc(var(--v)*1%);opacity:1}
.pin::before{content:"";position:absolute;left:50%;width:3px;margin-left:-1.5px;background:rgba(238,241,255,.55)}
.pin.guess{top:calc(100% + 8px + var(--lane,0)*38px)}
.pin.guess::before{bottom:100%;height:calc(8px + var(--lane,0)*38px)}
.pin.guess i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--c);color:var(--ink);font-style:normal;font-weight:800;border:3px solid var(--bg)}
.pin.guess.best i{box-shadow:0 0 0 4px var(--sun),0 0 24px var(--sun)}
.pin.actual{bottom:calc(100% + 10px);--d:1.2s}
.pin.actual::before{top:100%;height:10px}
.pin.actual b{display:grid;place-items:center;min-width:64px;height:48px;padding:0 12px;border-radius:14px;background:var(--hot);color:#fff;font-family:var(--display);font-size:24px;box-shadow:0 8px 30px rgba(255,79,109,.55)}

/* --- slider --- */
.rng{-webkit-appearance:none;appearance:none;width:100%;height:20px;border-radius:99px;background:linear-gradient(90deg,var(--cyan),#8d7bff 50%,var(--hot));outline-offset:8px;margin:14px 0}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;background:#fff;border:5px solid var(--sun);box-shadow:0 4px 14px rgba(0,0,0,.45)}
.rng::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:5px solid var(--sun)}
.bignum{font-family:var(--display);font-weight:900;font-size:64px;text-align:center;line-height:1;background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.scoring .tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tier{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.tier b{font-family:var(--display);font-weight:900;font-size:24px;line-height:1;color:var(--gold)}
.tier small{color:var(--muted);font-size:12px;font-weight:700}
.sc-note{color:var(--muted);font-size:14px;line-height:1.45;margin:0}
.sc-note b{color:var(--mint)}
.sc-mini{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:4px}
.tierline{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.tierline span{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.tierline b{color:var(--gold)}
.tierline .bonus b{color:var(--mint)}
.chk{display:flex;gap:10px;align-items:center;font-weight:600;color:var(--text)}
.chk input{width:22px;height:22px;accent-color:var(--gold)}
.muted{color:var(--muted)}
.lockbar{position:sticky;bottom:0;z-index:5;display:flex;flex-direction:column;gap:6px;margin:0 -16px;padding:18px 16px max(12px,env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(11,15,35,0),rgba(11,15,35,.94) 32%)}
.lockbar .warn{margin:0;text-align:center}
.lockbar[hidden]{display:none}
@media (max-height:720px){
  body:not(.tv) .lz-in{padding-top:10px;padding-bottom:10px}
  body:not(.tv) .qt{font-size:clamp(16px,4.4vw,20px)}
  body:not(.tv) .bignum{font-size:46px}
  body:not(.tv) .card{padding:14px;gap:8px}
  body:not(.tv) .wrap{gap:10px}
  body:not(.tv) .ticks{display:none}
  body:not(.tv) .ring{width:112px}
  body:not(.tv) .bigpts{font-size:44px}
  .phead{padding-bottom:0}
}
@media (min-width:561px){.lockbar{margin:0;padding-left:0;padding-right:0}}
@media (max-height:480px){
  body:not(.tv) .lede,body:not(.tv) .sc-mini,body:not(.tv) .lockbar .warn{display:none}
  body:not(.tv) .qt{font-size:16px}
  body:not(.tv) .lz-in{padding:8px 36px}
  body:not(.tv) .bignum{font-size:30px}
  body:not(.tv) .card{padding:10px 14px;gap:4px}
  body:not(.tv) .lockbar{padding-top:10px}
  body:not(.tv) .lockbar .btn{padding:10px}
}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:700;padding:0 2px;margin-top:-4px}
.ring{--f:1;width:clamp(120px,38vw,170px);aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--f)*1turn),rgba(255,255,255,.1) 0);display:grid;place-items:center;box-shadow:0 0 40px rgba(245,200,75,.25)}
.ring-in{width:80%;aspect-ratio:1;border-radius:50%;background:var(--bg);display:grid;place-content:center;text-align:center}
.ring-in b{font-family:var(--display);font-weight:900;font-size:clamp(40px,12vw,56px);line-height:1}
.ring-in small{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.pnum{font-family:var(--display);font-weight:900;font-size:44px;color:var(--gold);line-height:1}
/* quiz-show question banner */
.lz{--cut:clamp(14px,2.2vw,38px);padding:3px;background:linear-gradient(90deg,var(--gold2),#FFE9A6 50%,var(--gold2));clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% 50%,calc(100% - var(--cut)) 100%,var(--cut) 100%,0 50%)}
.lz-in{background:linear-gradient(180deg,#1d2a74,#0e1543);clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% 50%,calc(100% - var(--cut)) 100%,var(--cut) 100%,0 50%);padding:clamp(14px,1.8vw,30px) calc(var(--cut) * 1.5);text-align:center}
.lz .qt,.lz .tvq{margin:0}
.stp{display:flex;align-items:center;gap:clamp(10px,1.2vw,18px);font-size:clamp(15px,1.9vw,30px);font-weight:700}
.stp i{flex:none;display:grid;place-items:center;width:clamp(30px,3vw,48px);height:clamp(30px,3vw,48px);border-radius:50%;background:linear-gradient(160deg,#FFE9A6,var(--gold) 50%,var(--gold2));color:var(--ink);font-style:normal;font-family:var(--display);font-weight:900}
.mini-ends{display:flex;justify-content:space-between;gap:12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.mini-ends span:first-child{color:var(--cyan)} .mini-ends span:last-child{color:var(--hot);text-align:right}

/* --- Aman's setup --- */
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.qcard.unset{opacity:.8;border-style:dashed}
.qtop{display:flex;gap:10px;align-items:flex-start}
.qnum{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--panel2);font-weight:800;font-size:13px;color:var(--muted)}
.qtop .qt2{flex:1;min-width:0;font-weight:600}
.x{flex:none;background:none;border:0;color:var(--muted);font-size:22px;line-height:1;padding:0 4px}
.qval{display:flex;align-items:center;gap:10px}
.qval b{font-family:var(--display);font-size:22px;min-width:2.2ch}
.qval small{color:var(--muted);flex:1}
.qcard:not(.unset) .qval b{color:var(--sun)}
.startbar{position:sticky;bottom:max(8px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;background:linear-gradient(transparent,var(--bg) 40%);padding-top:18px}
.startbar small{color:var(--muted);text-align:center}
details.card summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:15px}
.sugg{display:flex;flex-direction:column;gap:8px}
.sugg-item{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--sun);border-radius:14px;padding:10px 12px}
.sugg-item p{flex:1;min-width:0;font-weight:600}
.sugg-item small{display:block;color:var(--muted);font-weight:500}
.mine{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px dashed var(--hot);border-radius:16px;padding:14px 16px}
.warn{font-size:13px;color:var(--muted);text-align:center}
.btnrow{display:flex;gap:10px;flex-wrap:wrap} .btnrow .btn{flex:1}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100vw - 32px);text-align:center;background:var(--mint);color:var(--ink);font-weight:700;padding:10px 16px;border-radius:99px;z-index:70}
.toast.bad{background:var(--hot);color:#fff}
.net.vtop{top:0;bottom:auto;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px}
.net{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--hot);color:#fff;text-align:center;font-weight:700;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}

/* --- results --- */
.res{display:flex;flex-direction:column;gap:6px}
.res-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:linear-gradient(180deg,rgba(34,45,108,.7),rgba(20,27,70,.85));border:1px solid rgba(130,150,255,.25);border-radius:12px;padding:8px 12px}
.res-row.best{border-color:var(--gold);background:linear-gradient(180deg,rgba(90,80,40,.55),rgba(40,36,30,.8));box-shadow:0 0 24px rgba(245,200,75,.18)}
.res-row .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.res-row .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-row .g{color:var(--muted);font-variant-numeric:tabular-nums}
.res-row .pts{font-family:var(--display);font-weight:700;color:var(--mint);min-width:3.5ch;text-align:right}
.res-row .tot{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.podium{display:flex;align-items:stretch;justify-content:center;gap:12px;height:min(46vh,360px);margin-top:8px}
.podium .step{flex:1;max-width:220px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;text-align:center;min-width:0}
.podium .bar{width:100%;height:calc((100% - 64px)*var(--k,1));border-radius:16px 16px 0 0;background:linear-gradient(var(--c),color-mix(in srgb,var(--c) 40%,var(--bg)));display:grid;place-items:start center;padding-top:12px;font-family:var(--display);font-weight:900;font-size:clamp(28px,5vw,56px);color:var(--ink)}
.podium .pname{font-family:var(--display);font-weight:700;font-size:clamp(14px,2.2vw,26px);overflow-wrap:anywhere}
.podium .psc{color:var(--muted);font-weight:700}

/* --- big screen (TV) --- */
body.tv .wrap{max-width:1500px;gap:clamp(12px,2vw,28px)}
.tvhead{display:flex;justify-content:space-between;align-items:center}
.tvhead .brand{font-size:clamp(14px,1.6vw,22px)} .tvhead .code{font-size:clamp(14px,1.6vw,22px)}
.tvsetup{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(16px,2.6vw,40px);align-items:center;min-height:min(72vh,780px)}
@media (max-width:900px){.tvsetup{grid-template-columns:1fr}}
.joinhero{display:flex;flex-direction:column;gap:clamp(8px,1.4vw,18px);justify-content:center}
.joinrow{display:flex;align-items:center;gap:clamp(12px,1.8vw,30px)}
.joincol{display:flex;flex-direction:column;gap:clamp(6px,1vw,14px);min-width:0}
.qrbox{flex:none;width:clamp(110px,min(13vw,23vh),280px);aspect-ratio:1;border-radius:clamp(10px,1vw,16px);background:#fff;padding:clamp(5px,.5vw,9px);box-shadow:0 0 0 3px var(--gold),0 10px 40px rgba(245,200,75,.25)}
.qrbox svg{width:100%;height:100%;display:block}

.i-dots{position:fixed;left:50%;top:max(14px,1.6vw);transform:translateX(-50%);display:flex;gap:10px}
.i-dots i{width:clamp(8px,.9vw,14px);height:clamp(8px,.9vw,14px);border-radius:50%;background:var(--line)} .i-dots i.on{background:var(--sun)}
.i-nav{position:fixed;left:0;right:0;bottom:max(46px,3.6vw);display:flex;justify-content:center;align-items:center;gap:clamp(10px,1.4vw,24px);z-index:3}
.i-nav .btn{font-size:clamp(14px,1.5vw,24px);padding:clamp(10px,1.1vw,18px) clamp(18px,2.2vw,40px)}
.i-nav .btn:disabled{opacity:.35}
.i-skip{position:fixed;left:0;right:0;justify-content:center;bottom:max(10px,.8vw);display:flex;align-items:center;gap:12px;color:var(--muted);font-size:clamp(12px,1.2vw,18px)}
@media (prefers-reduced-motion:reduce){.scene,.b,.i-tiers div,.i-q,.i-knob,.i-ph-btn{animation:none}}

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };

function pop(big){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas'); c.width=innerWidth; c.height=innerHeight;
  c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60'; document.body.appendChild(c);
  const x=c.getContext('2d'), ps=[], n=big?55:26, sz=Math.max(30,Math.min(innerWidth,innerHeight)/(big?15:18));
  for(let i=0;i<n;i++)ps.push({x:c.width/2,y:c.height*.4,vx:(Math.random()-.5)*(big?26:17),vy:-Math.random()*(big?19:13)-4,r:sz*(.55+Math.random()*.7),rot:(Math.random()-.5)*.8,vr:(Math.random()-.5)*.16});
  const hasFace=FACE.complete&&FACE.naturalWidth>0; let t=0;
  (function f(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.vy+=.4;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.rot+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.rot);
      if(hasFace)x.drawImage(FACE,-p.r/2,-p.r/2,p.r,p.r); else {x.fillStyle='#FFD23F';x.beginPath();x.arc(0,0,p.r/2,0,7);x.fill()}
      x.restore()});
    if(++t<240)requestAnimationFrame(f); else c.remove();
  })();
}

/* ---------- backend (plain REST, no library) ---------- */
async function api(method,qs,body,extra){
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),9000);
  try{
    const res=await fetch(SB+qs,{method,signal:ctl.signal,cache:'no-store',
      headers:Object.assign({apikey:KEY,Authorization:'Bearer '+KEY},body?{'Content-Type':'application/json'}:{},extra||{}),
      body:body?JSON.stringify(body):undefined});
    if(!res.ok)throw new Error('HTTP '+res.status);
    return method==='GET'?await res.json():null;
  } finally{clearTimeout(to)}
}

/* ---------- state ---------- */
const qs=new URLSearchParams(location.search);
const PREFILL=clean(qs.get('r'));
let VIEW=['tv','host','play'].includes(qs.get('v'))?qs.get('v'):'';
let ROOM=VIEW?PREFILL:'';
const base=location.origin+location.pathname;
function qrSvg(text){
  try{ const q=qrcode(0,'M'); q.addData(text); q.make(); const n=q.getModuleCount(); let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+='M'+c+' '+r+'h1v1h-1z';
    return '<svg viewBox="-2 -2 '+(n+4)+' '+(n+4)+'" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect x="-2" y="-2" width="'+(n+4)+'" height="'+(n+4)+'" fill="#fff"/><path d="'+d+'" fill="#0B0F23"/></svg>';
  }catch(e){ return ''; }
}
const shortUrl=location.host+location.pathname.replace(/index\.html$/,'');
const app=$('#app');
let cache=new Map(), pending=new Map(), loaded=false, curSig='', pollP=null, fails=0, rq=false, looping=false;

const R=()=>{const r=cache.get('room:'+ROOM);return r&&r.data};
const hostRow=()=>{const r=cache.get('host:'+ROOM);return r&&r.data};
const keyRow=()=>{const r=cache.get('key:'+ROOM);return r&&r.data};
const rows=kind=>[...cache.values()].filter(r=>r.kind===kind);
const revealFor=qid=>{const r=cache.get('reveal:'+ROOM+':'+qid);return r&&r.data};
const answersOf=pid=>{const r=cache.get('ans:'+ROOM+':'+pid);return (r&&r.data.answers)||{}};
function players(){
  const gone=new Set(rows('gone').map(r=>r.id.split(':')[2])), tot={};
  rows('reveal').forEach(r=>(r.data.results||[]).forEach(x=>{tot[x.pid]=(tot[x.pid]||0)+(x.pts||0)}));
  return rows('player').map(r=>({pid:r.id.split(':')[2],name:r.data.name||'?',at:r.data.at,score:tot[r.id.split(':')[2]]||0}))
    .filter(p=>!gone.has(p.pid)).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));
}
const answered=(ps,qid)=>ps.filter(p=>answersOf(p.pid)[qid]!=null);

function merge(data){
  const m=new Map(); data.forEach(r=>m.set(r.id,r));
  const now=Date.now();
  pending.forEach((p,id)=>{
    const s=m.get(id);
    if(now-p.t>15000||(s&&Date.parse(s.updated_at)>=Date.parse(p.row.updated_at)))pending.delete(id); else m.set(id,p.row);
  });
  cache=m;
}
function showNet(on){ $('#net').hidden=!on; }
function poll(){
  if(!ROOM)return Promise.resolve();
  if(pollP)return pollP;
  const f=(VIEW==='tv'||VIEW==='host')?'in.('+ROOM+','+ROOM+'S)':'eq.'+ROOM;
  pollP=api('GET','?select=id,room,kind,data,updated_at&room='+f)
    .then(d=>{merge(d);fails=0;loaded=true;showNet(false)})
    .catch(()=>{fails++;if(fails>=3)showNet(true)})
    .finally(()=>{pollP=null;queueRender()});
  return pollP;
}
async function refreshNow(){ if(pollP)await pollP; return poll(); }
async function put(id,kind,data,room){
  const row={id,room:room||ROOM,kind,data,updated_at:new Date().toISOString()};
  pending.set(id,{row,t:Date.now()}); cache.set(id,row); queueRender();
  for(let i=0;i<4;i++){
    try{ await api('POST','?on_conflict=id',[row],{Prefer:'resolution=merge-duplicates,return=minimal'}); return true; }
    catch(e){ await sleep(400*(i+1)); }
  }
  pending.delete(id); return false;
}
function queueRender(){ if(rq)return; rq=true; requestAnimationFrame(()=>{rq=false;render()}); }
function mount(sig,html,bind,keep){
  if(sig===curSig)return false;
  const y=keep&&curSig.split(':')[0]===sig.split(':')[0]?window.scrollY:0;
  curSig=sig; app.className=''; app.innerHTML=html; if(bind)bind(); window.scrollTo(0,y); return true;
}
function setHtml(el,html){ if(el&&el._h!==html){el._h=html;el.innerHTML=html} }
function setText(el,t){ if(el&&el.textContent!==t)el.textContent=t; }

function enterRoom(view){
  VIEW=view; document.body.classList.toggle('tv',view==='tv');
  try{history.replaceState(null,'','?r='+ROOM+'&v='+view)}catch(e){}
  cache=new Map(); loaded=false; curSig=''; fails=0;
  if(view==='tv'&&navigator.wakeLock){navigator.wakeLock.request('screen').catch(()=>{})}
  if(!looping){looping=true;setInterval(poll,1000);setInterval(tick,500)}
  render(); poll();
}

/* ---------- shared widgets ---------- */
let armKick=null;
function chipsHtml(done,kick){
  const ps=players(); if(!ps.length)return '<span class="code">Nobody yet.</span>';
  const armed=armKick&&Date.now()-armKick.t<4000?armKick.pid:null;
  return ps.map(p=>'<span class="chip'+(done&&done.has(p.pid)?' done':'')+(armed===p.pid?' armed':'')+'" style="--c:'+colorFor(p.pid)+'"><i>'+esc(labelFor(p.pid,p.name))+'</i>'+esc(p.name)+
    (kick?'<button class="kick" data-kick="'+esc(p.pid)+'" aria-label="Remove '+esc(p.name)+'">'+(armed===p.pid?'Remove?':'×')+'</button>':'')+'</span>').join('');
}
function bindKick(el){
  el.addEventListener('click',e=>{
    const b=e.target.closest('[data-kick]'); if(!b)return; const pid=b.dataset.kick;
    if(armKick&&armKick.pid===pid&&Date.now()-armKick.t<4000){ armKick=null; put('gone:'+ROOM+':'+pid,'gone',{at:Date.now()}); }
    else { armKick={pid,t:Date.now()}; }
    queueRender();
  });
}
function scaleBar(q,pins,actual){
  const sorted=[...pins].sort((a,b)=>a.v-b.v);
  const pinHtml=sorted.map((p,i)=>'<div class="pin guess'+(p.best?' best':'')+'" style="--v:'+p.v+';--lane:'+(i%3)+';--c:'+p.c+';--d:'+(i*0.12)+'s"><i>'+esc(p.t)+'</i></div>').join('');
  const act=actual!=null?'<div class="pin actual" style="--v:'+actual+'"><b>'+actual+'</b></div>':'';
  return '<div class="scale"><div class="ends"><span>'+esc(q.left)+'</span><span>'+esc(q.right)+'</span></div><div class="track-outer"><div class="track">'+pinHtml+act+'</div></div></div>';
}
function animatePins(){ setTimeout(()=>app.querySelectorAll('.pin').forEach(p=>p.classList.add('in')),80); }
function leaderboardHtml(rev){

}
function tvResultsHtml(rev){
  const by={}; rev.results.forEach(x=>by[x.pid]=x);
  const ps=players(), cols=ps.length>14?' c3':ps.length>6?' c2':'';
  return '<div class="res tvres'+cols+'">'+ps.map(p=>{const x=by[p.pid];
    return '<div class="res-row'+(x&&x.best?' best':'')+'" style="--c:'+colorFor(p.pid)+'"><span class="rk">'+rankOf(p.pid)+'</span><span class="dot"></span><span class="nm">'+esc(p.name)+'</span><span class="g">'+(!x?'':x.value==null?'no guess':x.value)+'</span><span class="pts">'+(x?'+'+x.pts:'')+'</span><span class="tot">'+p.score+'</span></div>'}).join('')+'</div>';
}
function rankOf(pid){ const ps=players(), me=ps.find(p=>p.pid===pid); return me?1+ps.filter(p=>p.score>me.score).length:0; }
function resultsHtml(rev){
  const rs=[...rev.results].sort((a,b)=>b.pts-a.pts||(a.dist==null)-(b.dist==null));

async function landingJoin(){
  const code=$('#jCode').value.trim(), name=$('#jName').value.trim();

  const btn=$('#jGo'); btn.disabled=true;
  try{
    const rs=await api('GET','?select=id,kind,data&room=eq.'+code+'&kind=in.(room,player,gone)');
    if(!rs.some(r=>r.id==='room:'+code)){toast('No room with that code. Check the big screen.',true);return}
    const goneIds=new Set(rs.filter(r=>r.kind==='gone').map(r=>r.id.split(':')[2])), pl=rs.filter(r=>r.kind==='player'&&!goneIds.has(r.id.split(':')[2])), same=n=>(n||'').trim().toLowerCase()===name.toLowerCase();

['pointerdown','keydown'].forEach(ev=>window.addEventListener(ev,()=>{ if(VIEW==='tv')audio() },{passive:true}));
function drumRoll(ms){
  const ac=audio(); if(!ac)return; try{
  const t0=ac.currentTime+.02, dur=ms/1000-.5, g=ac.createGain(); g.connect(ac.destination);
  const nb=ac.createBuffer(1,ac.sampleRate*.12,ac.sampleRate), d=nb.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  for(let t=0,i=0;t<dur;i++){ const step=Math.max(.045,.14-.1*(t/dur));
    const src=ac.createBufferSource(); src.buffer=nb; const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1800; const v=ac.createGain();
    v.gain.value=.25+.55*(t/dur); src.connect(f); f.connect(v); v.connect(g); src.start(t0+t); t+=step; }
  const o=ac.createOscillator(), og=ac.createGain(); o.type='sine'; o.frequency.setValueAtTime(110,t0); o.frequency.exponentialRampToValueAtTime(60,t0+dur);
  og.gain.setValueAtTime(.0001,t0); og.gain.linearRampToValueAtTime(.5,t0+dur); og.gain.exponentialRampToValueAtTime(.0001,t0+dur+.4); o.connect(og); og.connect(g); o.start(t0); o.stop(t0+dur+.45);
  // final crash
  const c=ac.createBufferSource(), cb=ac.createBuffer(1,ac.sampleRate*.9,ac.sampleRate), cd=cb.getChannelData(0); for(let i=0;i<cd.length;i++)cd[i]=(Math.random()*2-1)*Math.pow(1-i/cd.length,3);
  c.buffer=cb; const cg=ac.createGain(); cg.gain.value=.7; c.connect(cg); cg.connect(ac.destination); c.start(t0+dur+.05);
  }catch(e){} }

function sfx(k,fallback){
  const a=VIEW==='tv'&&sfxEl(k); if(!a){ if(fallback)fallback(); return; }
  try{ a.pause(); a.currentTime=SFX[k].from; a.volume=1; const p=a.play(); if(p&&p.catch)p.catch(()=>{ if(fallback)fallback(); }); }catch(e){ if(fallback)fallback(); }

let _rv=null;
function revealFx(r){
  const el=$('#lockover'); if(!el)return;
  const total=Math.max(1200,(r.lockAt||Date.now()+LOCK_MS)-Date.now()), q=(r.questions||[])[r.qi], k=keyRow(), actual=q&&k&&k.secrets?k.secrets[q.id]:null;
  const num=$('#rvnum'), knob=$('#rvknob'), t0=Date.now(), land=Math.max(600,total-900), hit=Math.min(200,land/3);
  el.classList.remove('hit','land'); setText(num,'?'); if(knob)knob.style.setProperty('--x','50%');
  sfx('rev',()=>drumRoll(total));
  const show=v=>{ setText(num,String(v)); if(knob)knob.style.setProperty('--x',v+'%'); };
  let last=0;
  const step=()=>{
    if(!_rv||!document.body.contains(el))return;
    const t=Date.now()-t0;
    if(t>=hit&&!el.classList.contains('hit'))el.classList.add('hit');
    if(t>=land){ if(actual!=null){ el.classList.add('land'); show(actual); } return; }
    const p=Math.max(0,(t-hit)/(land-hit)), gap=40+Math.pow(p,2.2)*420;
    if(t>=hit&&t-last>=gap){ last=t; show(Math.floor(Math.random()*101)); }
    _rv.raf=requestAnimationFrame(step);
  };
  _rv={raf:requestAnimationFrame(step)};
}

  el.hidden=r.rphase!=='locking';
  if(r.rphase==='locking'&&!_drumOn){ _drumOn=true; revealFx(r); }

}

  if(!pend){clearInterval(pendTimer);return}
  const left=pend.end-Date.now();
  const ring=$('#ring'); if(ring)ring.style.setProperty('--f',(Math.max(0,left)/PEND_MS).toFixed(3));
  setText($('#pnum'),String(Math.max(1,Math.ceil(left/1000))));
  if(left>0)return;
  const p=pend; cancelPend();
  const r=R(), pid=myPid(), cur=r&&(r.questions||[])[r.qi];
  if(r&&r.phase==='playing'&&r.rphase==='guess'&&cur&&cur.id===p.qid){
    const ok=await put('ans:'+ROOM+':'+pid,'ans',{answers:{...answersOf(pid),[p.qid]:p.value}});
    if(!ok)toast('Did not send. Tap Lock it in again.',true);
  }
  curSig=''; render();
}
function renderPlayer(){
  const r=R(), hn=r.hostName||'Aman', pid=myPid();
  if(pid&&rows('gone').some(g=>g.id==='gone:'+ROOM+':'+pid)){ mount('p-gone','<main class="wrap">'+pHead()+'<h1 class="h1">You were removed</h1><p class="lede">The person running the big screen took you out of this room. If that was a mistake, join again as a new player.</p><button id="rejoin" class="btn sun big">Join again</button></main>',()=>{$('#rejoin').onclick=()=>{MYPID='';sstore.set('bday_pid_'+ROOM,'');curSig='';render()}}); return; }
  const prow=pid&&cache.get('player:'+ROOM+':'+pid);
  if(!prow){
    mount('p-join','<main class="wrap">'+pHead()+'<h1 class="h1">Join the game</h1><p class="lede">Can you read '+esc(hn)+' better than your friends can?</p><section class="card"><label for="pname">Your name</label><input id="pname" maxlength="14" autocomplete="off" value="'+esc(sstore.get('bday_name')||'')+'"><button id="pjoin" class="btn sun big">Join</button></section></main>',
      ()=>{ const go=async()=>{const name=($('#pname').value||'').trim(); if(!name)return toast('Type your name',true);
        const lp=store.get('bday_pid_'+ROOM), back=lp&&players().find(p=>p.pid===lp&&p.name.toLowerCase()===name.toLowerCase());
        if(back){ $('#pjoin').disabled=true; await joinAs(ROOM,back.name,back.pid); return; }
        const dup=players().find(p=>p.name.toLowerCase()===name.toLowerCase());
        $('#pjoin').disabled=true; if(dup)toast('Welcome back, '+dup.name); await joinAs(ROOM,dup?dup.name:name,dup?dup.pid:null,dup?dup.at:null); const jb=$('#pjoin'); if(jb)jb.disabled=false;};
        $('#pjoin').onclick=go; $('#pname').addEventListener('keydown',e=>{if(e.key==='Enter')go()}); });
    return;
  }
  const me=players().find(p=>p.pid===pid)||{name:prow.data.name,score:0,pid};
  if(r.phase==='setup'){
    mount('p-wait','<main class="wrap">'+pHead()+'<h1 class="h1">You\'re in, '+esc(me.name)+'.</h1><p class="lede" id="pwait"></p>'+scoringHtml(hn)+
      '<section class="card"><h2>Suggest a question</h2><p class="lede">Something '+esc(hn)+' will have to dodge. '+esc(hn)+' decides if it goes in.</p><label for="sg-text">Statement</label><input id="sg-text" maxlength="120" placeholder="'+esc(hn)+' has stalked an ex online."><label for="sg-scale">Scale</label><select id="sg-scale">'+Object.keys(SCALES).map(k=>'<option value="'+k+'">'+SCALE_NAMES[k]+'</option>').join('')+'<option value="custom">Custom: write both ends…</option></select><div id="sg-custom" class="stack" hidden style="margin-top:0"><input id="sg-left" maxlength="24" placeholder="Left end, e.g. Never"><input id="sg-right" maxlength="24" placeholder="Right end, e.g. Every day"></div><button id="sg-send" class="btn sun">Send to '+esc(hn)+'</button></section>'+
      '<section><h2 class="qlabel" style="margin-bottom:8px">In the room</h2><div class="chips" id="chips"></div></section></main>',
      ()=>{ $('#sg-scale').onchange=()=>{$('#sg-custom').hidden=$('#sg-scale').value!=='custom'}; $('#sg-send').onclick=async()=>{const text=($('#sg-text').value||'').trim(); if(!text)return toast('Write the statement first',true); const k=$('#sg-scale').value; let l,rr;
        if(k==='custom'){l=($('#sg-left').value||'').trim();rr=($('#sg-right').value||'').trim(); if(!l||!rr)return toast('Fill in both ends of the scale',true);} else [l,rr]=SCALES[k];
        const ok=await put('sugg:'+ROOM+':'+rid(8),'sugg',{text,left:l,right:rr,by:me.name}); if(ok){$('#sg-text').value='';toast('Sent to '+hn)}else toast('Could not send. Try again.',true)}; });
    setText($('#pwait'),'Waiting for the game to start.');
    setHtml($('#chips'),chipsHtml());
    return;
  }
  if(r.phase==='done'){
    const ps=players(), rank=rankOf(pid);
    mount('p-done','<main class="wrap">'+pHead()+'<h1 class="h1">Final result</h1><div class="card" style="align-items:center;text-align:center"><div class="qlabel">You finished</div><div class="bigpts" style="color:var(--sun)">#'+rank+'</div><p class="lede">'+me.score+(me.score===1?' point':' points')+'</p></div>'+
      '<div class="res">'+ps.map((p,i)=>'<div class="res-row'+(p.pid===pid?' best':'')+'" style="--c:'+colorFor(p.pid)+'"><span class="dot"></span><span class="nm">'+rankOf(p.pid)+'. '+esc(p.name)+'</span><span></span><span class="tot">'+p.score+'</span></div>').join('')+'</div></main>',()=>{if(rank===1)pop(true)});
    return;
  }
  const q=(r.questions||[])[r.qi]; if(!q)return;
  const rev=revealFor(q.id), mine=answersOf(pid)[q.id];
  if(pend&&(r.rphase!=='guess'||mine!=null||pend.qid!==q.id))cancelPend();
  const head=pHead()+'<div class="qlabel">Question '+(r.qi+1)+' of '+r.questions.length+'</div>'+lz('<h1 class="qt">'+esc(q.text)+'</h1>');
  if(r.rphase==='reveal'){
    if(!rev){ mount('p-scoring:'+r.qi,'<main class="wrap">'+head+'<div class="card" style="text-align:center"><p class="lede">Scoring…</p></div></main>'); return; }
    const x=rev.results.find(y=>y.pid===pid)||{value:null,pts:0}, rank=rankOf(pid);
    mount('p-r:'+r.qi,'<main class="wrap">'+head+scaleBar(q,pinsFrom(rev),rev.actual)+
      '<div class="card" style="text-align:center"><div class="qlabel">'+esc(hn)+' landed on</div><div class="bigpts" style="color:var(--hot)">'+rev.actual+'</div>'+
      '<div class="you-line"><span>You said</span><span>'+(x.value==null?'no guess':x.value)+'</span></div><div class="you-line"><span>This round</span><span style="color:var(--mint)">+'+x.pts+'</span></div><div class="you-line"><span>Total</span><span>'+me.score+' · rank '+rank+'</span></div>'+(x.best?'<span class="tag">Closest!</span>':'')+'</div>'+
      '<p class="warn">Look at the big screen for everyone\'s guesses.</p></main>',()=>{animatePins();if(x.best)setTimeout(()=>pop(false),1700)});
    return;
  }
  if(mine!=null){
    mount('p-l:'+r.qi,'<main class="wrap">'+head+'<div class="card" style="text-align:center"><div class="qlabel">Locked in</div><div class="bigpts" style="color:var(--sun)">'+mine+'</div><p class="lede" id="lstat"></p></div></main>');
    const ps=players(); setText($('#lstat'),r.rphase==='locking'?'Revealing in a moment…':(()=>{const n=answered(ps,q.id).length;return ps.length&&n>=ps.length?'Everyone is in. Waiting for '+hn+' to reveal…':n+' of '+ps.length+' locked in. Waiting for the rest.'})());
    return;
  }
  if(pend){
    mount('p-pend:'+r.qi,'<main class="wrap">'+head+'<div class="card" style="align-items:center;text-align:center"><div class="qlabel">Locking in…</div><div class="ring" id="ring" style="--f:1"><div class="ring-in"><b id="pnum">5</b><small>sec</small></div></div><div class="pnum">'+pend.value+'</div><p class="lede">Your guess locks for good when the timer ends.</p></div><div class="lockbar"><button id="chg" class="btn big">Change my answer</button></div></main>',
      ()=>{ $('#chg').onclick=()=>{cancelPend();curSig='';render()}; });
    return;
  }
  if(r.rphase!=='guess'){
    mount('p-late:'+r.qi,'<main class="wrap">'+head+'<div class="card" style="text-align:center"><p class="lede">This round already locked. Catch the next one.</p></div></main>');
    return;
  }
  const dv=draft[q.id]!=null?draft[q.id]:50;
  mount('p-g:'+r.qi,'<main class="wrap">'+head+'<p class="lede">Where did '+esc(hn)+' place himself? Ask him anything, then drag.</p>'+
    '<div class="card"><div class="mini-ends"><span>'+esc(q.left)+'</span><span>'+esc(q.right)+'</span></div><input id="gr" type="range" class="rng" min="0" max="100" value="'+dv+'" aria-label="Your guess"><div class="ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div><div class="bignum" id="gv">'+dv+'</div></div>'+
    '<div class="lockbar"><button id="lock" class="btn sun big">Lock it in</button><p class="warn">After you tap, you get 5 seconds to change your mind.</p></div>'+
    '<div class="sc-mini"><div class="qlabel">Points by distance from '+esc(hn)+'\'s number</div>'+scoringHtml(hn,true)+'</div></main>',
    ()=>{ const gr=$('#gr'); gr.addEventListener('input',()=>{setText($('#gv'),gr.value);draft[q.id]=parseInt(gr.value,10)});
      $('#lock').onclick=()=>startPend(q,parseInt(gr.value,10)); });
}

/* ---------- render / boot ---------- */
function render(){
  if(!ROOM){ mount('landing',landingHtml(),bindLanding); return; }
  if(!loaded){ mount('loading:'+VIEW,'<div class="center">Connecting…</div>'); return; }
  if(!cache.get('room:'+ROOM)){
    mount('noroom','<main class="wrap"><div class="brand">Kaun Banega Amanaire</div><h1 class="h1">Room '+esc(ROOM)+' not found</h1><p class="lede">Check the code on the big screen and try again.</p><a class="btn sun" href="'+esc(base)+'">Back</a></main>'); return;
  }
  if(VIEW==='tv')renderTV(); else if(VIEW==='host')renderHost(); else renderPlayer();
}
let verBad=0;
function verCheck(){
  const r=R(), el=$('#ver'); if(!el)return;
  if(VIEW==='tv'){ if(r&&r.ver!==VER&&!cmdBusy)put('room:'+ROOM,'room',{...r,ver:VER}); else if(r&&r.opener&&!op&&!cmdBusy)put('room:'+ROOM,'room',{...r,opener:false}); return; }
  let msg='';
  if(r&&loaded){
    if((r.ver||0)>VER)msg='A newer version is out. Refresh this page.';
    else if(VIEW==='host'&&(r.ver||0)<VER)msg='The big screen is on an old version, so Start/Next won\'t reach it. Refresh the page on the TV.';
  }
  if(msg){ if(!verBad)verBad=Date.now(); } else verBad=0;
  const show=!!msg&&Date.now()-verBad>4000; el.hidden=!show; if(show&&el.textContent!==msg)el.textContent=msg;
}
function tick(){
  verCheck();
  if(VIEW==='tv'){tvCmd();tvEngine();}
  const r=R(); if(r&&r.phase==='playing'&&VIEW==='tv')syncLock(r);
}
document.addEventListener('keydown',e=>{
  if(VIEW!=='tv'||e.target.matches('input,textarea,select,button'))return;
  const go=e.code==='Space'||e.key==='Enter', r=R();
  if(op){ if(e.key==='Escape'||go){e.preventDefault();endOpener();} return; }
  if(intro){
    if(e.key==='Escape'){e.preventDefault();endIntro();}
    else if(go||e.key==='ArrowRight'){e.preventDefault();showScene(intro.i+1);}
    else if(e.key==='ArrowLeft'){e.preventDefault();showScene(intro.i-1);}
    return;
  }
  /* emergency fallback if the birthday person's phone dies */
  if(go&&r){e.preventDefault(); tvAct(r.phase==='setup'?'start':r.phase==='playing'&&r.rphase==='guess'?'reveal':'next',{intro:true});}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
if(ROOM)enterRoom(VIEW); else render();
})();
</script>
